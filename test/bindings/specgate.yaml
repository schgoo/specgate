# yaml-language-server: $schema=../../binding-schema.json
#
# Shared binding for the CTSC golden matrix. Every fixture component lists the
# implementations the matrix exercises; YAML anchors share the per-project
# implementation blocks.
components:
  comp.app:
    implementations:
      rust: &rust_fixtures
        language: rust
        sources: ../rust/crates/specgate-ctsc-fixtures
        tests:
          projects:
            - ../rust/crates/specgate-ctsc-fixtures/Cargo.toml
      csharp: &csharp_fixtures
        language: csharp
        sources: ../csharp/SpecGate.CtscFixtures
        tests:
          projects:
            - ../csharp/SpecGate.CtscFixtures/SpecGate.CtscFixtures.csproj
