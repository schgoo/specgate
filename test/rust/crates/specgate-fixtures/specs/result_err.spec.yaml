spec_version: 0.4.0
name: fixture.result_err
binding:
  - binding.yaml
  - csharp.yaml
operations:
  try_divide:
    inputs:
      a: i32
      b: i32
    outputs:
    - $result: "Result<i32, string>"
cases:
- name: divide_by_zero
  desc: Division by zero returns Err variant
  operation: try_divide
  inputs:
    a: 10
    b: 0
  expected:
  - $result:
      Err: division by zero
