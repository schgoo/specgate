spec_version: "0.4.0"
name: fixture.ambiguous_fallback
binding: binding.yaml

# Negative fixture for strict (component, operation) resolution. This component
# owns no operation named `render_ambiguous`. Two OTHER components in the same
# crate (fixture.ambiguous_one and fixture.ambiguous_two) each define one, so a
# by-name source scan WOULD be ambiguous — but resolution is component-scoped
# and never scans by name, so the harness must fail loud that this component
# owns no such operation rather than picking one from another component. See the
# engine-spec case `unresolved_operation_is_error`.
operations:
  render_ambiguous:
    outputs:
      - $result: string

cases:
  - name: renders
    desc: Ambiguous by-name fallback — run_spec must error, not silently pick.
    operation: render_ambiguous
    expected:
      - $result: "unreachable"
