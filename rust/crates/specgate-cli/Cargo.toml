[package]
name = "specgate-cli"
edition.workspace = true
version.workspace = true
description = "CLI for SpecGate CTSC discovery, capture, and replay"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
exclude = ["tests/fixtures/**"]

[features]
default = []
test-util = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "specgate"
path = "src/main.rs"

[dependencies]
ohno = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rustc-hash = { workspace = true }
specgate = { workspace = true }
specgate-ctsc = { workspace = true }
specgate-discovery = { workspace = true, features = ["serde", "raw-registry"] }
tempfile = { workspace = true }

[dev-dependencies]
toml = { workspace = true }

[lints]
workspace = true
