[package]
name = "specgate-typed-integration-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "typed_client"
path = "../typed-async/src/lib.rs"
test = false

[[test]]
name = "environment_contract"
path = "contracts/client.rs"

[dependencies]
specgate = { path = "../../../../specgate" }
serde = { version = "1", features = ["derive"] }
