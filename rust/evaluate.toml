# cargo-evaluate configuration for the SpecGate workspace.
#
# `just evaluate` runs the deterministic and semantic lint packs. These
# allowances baseline cargo-evaluate against the repository's ratified
# architecture and current public surface. They are workspace-wide only where
# the reported rule is fundamentally inapplicable or where applying it would
# require a human-owned API, CTSC, capture, replay, package-identity, or golden
# policy decision. New rules remain visible by default.

[lints]

# These generic API-design checks would require a workspace-wide public API
# migration. SpecGate instead evolves public contracts through explicit,
# human-reviewed compatibility decisions.
c_case = "allow"
c_common_traits = "allow"
c_conv = "allow"
c_custom_type = "allow"
c_failure = "allow"
c_feature = "allow"
c_no_out = "allow"
c_overload = "allow"
c_question_mark = "allow"
c_stable = "allow"
c_struct_private = "allow"
m_app_error = "allow"
m_box_dst = "allow"
m_canonical_docs = "allow"
m_design_for_ai = "allow"
m_doc_inline = "allow"
m_dont_leak_types = "allow"
m_errors_canonical_structs = "allow"
m_first_doc_sentence = "allow"
m_impl_asref = "allow"
m_impl_io = "allow"
m_impl_rangebounds = "allow"
m_init_builder = "allow"
m_init_cascaded = "allow"
m_parameter_consistency = "allow"
m_public_display = "allow"
m_short_names = "allow"
m_strong_types = "allow"
m_strong_types_guard = "allow"

# Workspace metadata, dependency placement, documentation layout, and lint
# policy are already enforced by Cargo, rustdoc, cargo-deny, Clippy, generated
# README checks, and the repository gate.
c_crate_doc = "allow"
c_metadata = "allow"
m_crates_in_workspace = "allow"
m_lint_override_expect = "allow"
m_no_prelude = "allow"
m_single_item_path = "allow"
m_static_verification = "allow"

# SpecGate's link-time registration, proc-macro facade, exact runtime package
# identity, and generated-runner architecture intentionally conflict with these
# generalized recommendations.
m_avoid_statics = "allow"
m_example_over_proc = "allow"
m_macro_helpers = "allow"
m_macro_last_resort = "allow"
m_macro_main_crate = "allow"
m_proc_impl = "allow"
m_proc_implied_items = "allow"
m_regular_fn = "allow"

# Large modules and existing allocation choices cannot be mechanically changed
# without risking CTSC encoding, discovery, capture, or replay behavior. Treat
# such changes as focused performance or maintainability work backed by tests,
# not automated evaluation cleanup.
m_balanced_modules = "allow"
m_fast_hasher = "allow"
m_hotpath = "allow"
m_initial_capacity = "allow"
m_mem_reuse = "allow"
m_shrink_to_fit = "allow"
m_throughput = "allow"

# Capture deliberately converts instrumentation failures into target failures,
# and guard destruction finalizes or persists deterministic capture state.
# Altering those failure semantics is a human-owned capture-policy decision.
c_dtor_fail = "allow"
m_log_overhead = "allow"
m_panic_is_stop = "allow"
m_panic_message = "allow"
m_panic_on_bug = "allow"

# SpecGate is a cross-platform library and CLI, not a deployment binary. It
# cannot pin a target CPU or wrap all filesystem/process operations behind
# mocks without changing the supported execution model.
m_mockable_syscalls = "allow"
m_target_cpu = "allow"

# The remaining semantic findings are subjective wording, logging, test-shape,
# or product/test-boundary recommendations already covered by focused review
# and the repository's CTSC golden gate.
m_documented_magic = "allow"
m_log_not_print = "allow"
m_log_structured = "allow"
m_tautological_tests = "allow"
m_test_util = "allow"
m_weasel_words = "allow"

# These rules encode Microsoft-internal policy and organization-specific
# libraries that are not part of SpecGate's open-source dependency contract.
m365_clippy = "allow"
m365_templated_uri_require = "allow"
