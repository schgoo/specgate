reason = "Renamed specgate dependencies are an explicit compatibility requirement, so expansions resolve the facade name with proc-macro-crate."

[[config.allow]]
rule = "m_macros_dont_lie"
file = "crates/specgate-cli/src/replay/error.rs"
reason = "The ohno-generated source, backtrace, and constructors are intentional parts of the repository-standard opaque error representation."


[[config.allow]]
rule = "m_macros_dont_lie"
file = "crates/specgate-annotations-macros-impl/src/operation.rs"
reason = "Async operation instrumentation intentionally desugars async fn to impl Future so it can capture the construction parent, open on first poll, and reinstall context on every poll while preserving the authored output type."

[[config.allow]]
rule = "m_types_send"
file = "crates/specgate-annotations-macros-impl/src/operation.rs"
reason = "The generated impl Future intentionally preserves the authored body's auto traits; forcing Send would reject valid local-executor operations and alter the authored async contract."

[[config.allow]]
rule = "m_types_send"
file = "crates/specgate-runtime/src/capture.rs"
reason = "InstrumentedFuture preserves the wrapped future's auto traits while its collector is Send and synchronized; requiring every wrapped future to be Send would reject supported same-thread executors."

[[config.allow]]
rule = "m_panic_continuation"
file = "crates/specgate-runtime/src/capture/tests.rs"
reason = "The focused test deliberately catches a target panic to prove scope cleanup restores ambient capture context; production macro expansion resumes the original panic instead of continuing."

[[config.allow]]
rule = "m_panic_on_bug"
file = "crates/specgate-runtime/src/capture/model.rs"
reason = "The public builder returns an explicit opaque error for incomplete dynamic span data; changing this to a panic would violate repository error policy and alter capture semantics."

[[config.allow]]
rule = "m_proc_implied_items"
file = "crates/specgate-annotations-macros-impl/src/lib.rs"
reason = "Stable hashed identifiers provide collision-resistant names for the hidden link-time metadata items required by discovery."

[[config.allow]]
rule = "m_proc_implied_items"
file = "crates/specgate-annotations-macros-impl/src/operation.rs"
reason = "Operation attributes require hygienically scoped linkme registration metadata so discovery can inventory annotated operation boundaries."

[[config.allow]]
rule = "m_proc_implied_items"
file = "crates/specgate-cli/src/capture/facade.rs"
reason = "The annotated capture facade operation must emit collision-resistant link-time metadata so discovery can inventory the public CTSC boundary."

[[config.allow]]
rule = "m_proc_implied_items"
file = "crates/specgate-cli/src/discover/failure.rs"
reason = "The repository-standard ohno error macro intentionally generates opaque constructors together with source and backtrace state."

