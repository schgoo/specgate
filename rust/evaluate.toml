# cargo-evaluate configuration for the SpecGate workspace.
#
# `just evaluate` runs the deterministic and semantic lint packs. Exceptions
# are exact rule/file pairs retained only where a ratified design or evaluator
# limitation prevents a source fix. cargo-evaluate 0.23 has no line, item, or
# span selector, so each exception necessarily covers one complete file.

[lints]

[[config.allow]]
rule = "m_avoid_statics"
file = "crates/specgate-annotations-macros-impl/src/event.rs"
reason = "SpecEvent derives must emit hygienic linkme registrations; candidate-rooted dependency resolution enforces one specgate-runtime package identity."

[[config.allow]]
rule = "m_avoid_statics"
file = "crates/specgate-runtime/src/capture.rs"
reason = "Per-run operation capture uses a Send synchronized collector carried by instrumented futures; only ambient poll installation and setup staging remain thread-local, and candidate package identity prevents duplicate runtime state."

[[config.allow]]
rule = "m_avoid_statics"
file = "crates/specgate-runtime/src/capture/setup.rs"
reason = "Pending setup inputs deliberately remain thread-local because async setup is unsupported and rejected; operation futures use the separate synchronized collector, and candidate package identity prevents duplicate runtime state."

[[config.allow]]
rule = "m_avoid_statics"
file = "crates/specgate-runtime/src/registry.rs"
reason = "Link-time discovery requires linkme distributed slices, and candidate-rooted dependency resolution enforces one runtime package identity."

[[config.allow]]
rule = "m_dont_leak_types"
file = "crates/specgate-ctsc/src/capture.rs"
reason = "Public CTSC capture types intentionally implement serde as the stable capture protocol; feature-gating them would break required format interoperability."

[[config.allow]]
rule = "m_dont_leak_types"
file = "crates/specgate-runtime/src/lib.rs"
reason = "Hidden macro plumbing re-exports linkme so expansions use the consumer's exact instance without requiring users to depend on linkme directly."

[[config.allow]]
rule = "m_errors_canonical_structs"
file = "crates/specgate-annotations-macros-impl/src/event.rs"
reason = "The unpublished proc-macro implementation boundary returns syn::Error directly to preserve source spans and native compiler diagnostics."

[[config.allow]]
rule = "m_errors_canonical_structs"
file = "crates/specgate-annotations-macros-impl/src/operation.rs"
reason = "The unpublished proc-macro implementation boundary returns syn::Error directly to preserve source spans and native compiler diagnostics."

[[config.allow]]
rule = "m_errors_canonical_structs"
file = "crates/specgate-cli/src/replay/error.rs"
reason = "The ratified opaque-error policy reports context through Display and retains causes and backtraces through std::error::Error and ohno::ErrorExt rather than rendering internal state."

[[config.allow]]
rule = "m_errors_canonical_structs"
file = "crates/specgate-ctsc/src/comparison/loading.rs"
reason = "The ratified opaque-error policy deliberately keeps document paths and operation categories out of the public LoadError API; Display and the source chain retain reporting context."

