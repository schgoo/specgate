[workspace]
members = [
    "crates/specgate-runtime",
    "crates/specgate-annotations-macros",
    "crates/specgate-discovery",
    "crates/specgate",
    "crates/specgate-cli",
    "crates/specgate-ctsc",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.6.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/schgoo/specgate"
homepage = "https://github.com/schgoo/specgate"
keywords = ["specgate", "testing", "verification", "ctsc"]
categories = ["development-tools::testing"]
rust-version = "1.93.0"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
syn = { version = "2.0.118", features = ["full", "extra-traits"] }
quote = "1.0.45"
proc-macro2 = "1.0.106"
proc-macro-crate = "3.4"
linkme = "0.3"
sha2 = "0.10"
tempfile = "3"
toml = "0.9"
specgate = { path = "crates/specgate", version = "0.6.0" }
specgate-annotations-macros = { path = "crates/specgate-annotations-macros", version = "0.6.0" }
specgate-runtime = { path = "crates/specgate-runtime", version = "0.6.0" }
specgate-discovery = { path = "crates/specgate-discovery", version = "0.6.0" }
specgate-ctsc = { path = "crates/specgate-ctsc", version = "0.6.0" }

# Dependencies are fetched from crates.io normally.

[workspace.lints.rust]
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

# Restriction lints worth enabling
clone_on_ref_ptr = "warn"
dbg_macro = "deny"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
semicolon_outside_block = "warn"

# Banned-API mechanism — configured in clippy.toml (disallowed-methods /
# disallowed-types). Denied here so a banned call/type is a hard error under
# `-D warnings`.
disallowed_methods = "deny"
disallowed_types = "deny"

# Allow these — too noisy or not applicable
too_many_lines = "allow"
cognitive_complexity = "allow"
multiple_crate_versions = "allow"

[workspace.lints.rustdoc]
missing_crate_level_docs = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
debug = "line-tables-only"
