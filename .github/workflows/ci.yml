name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            test/rust
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - uses: extractions/setup-just@v3
      - name: Install Rust gate tools
        run: |
          cargo install cargo-deny --version 0.19.0 --locked
          cargo install cargo-doc2readme --locked
      - name: Install CTSC validator dependencies
        run: python -m pip install -r docs/ctsc/requirements.txt
      - name: Run complete gate
        run: just check
      - name: Packaged-context smoke
        if: matrix.os == 'ubuntu-latest'
        run: just package-smoke
