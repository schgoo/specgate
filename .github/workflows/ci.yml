name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Each lane is a `just check-<lane>` recipe; `just check` is their union.
  check:
    name: check ${{ matrix.lane }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        lane: [rust-replay, rust-other, static, ctsc-smoke, ctsc-goldens]
    env:
      SPECGATE_CTSC_GOLDENS_BUILD_CACHE: artifacts/ctsc-goldens-build-cache/v2
      # The rust/target cache stays small; each Rust test run builds children from empty.
      SPECGATE_RUST_TEST_BUILD_DIR: scratch
      # Every CI build starts cold, so full debug info only costs disk and link time.
      # Swatinem/rust-cache already sets CARGO_INCREMENTAL=0.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      # Windows runs the gate from a ReFS Dev Drive copy of the checkout;
      # Cargo targets, child builds, and golden caches are I/O bound.
      - uses: samypr100/setup-dev-drive@v4
        if: runner.os == 'Windows'
        with:
          drive-size: 40GB
          workspace-copy: true
          trusted-dev-drive: true
      - name: Select gate workspace
        shell: bash
        run: echo "GATE_WORKSPACE=${DEV_DRIVE_WORKSPACE:-$GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.lane }}
          workspaces: |
            ${{ env.GATE_WORKSPACE }}/rust
            ${{ env.GATE_WORKSPACE }}/test
      - name: Cache golden build intermediates
        if: matrix.lane == 'ctsc-goldens'
        uses: actions/cache@v4
        with:
          path: ${{ env.GATE_WORKSPACE }}/${{ env.SPECGATE_CTSC_GOLDENS_BUILD_CACHE }}
          key: ctsc-goldens-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/rust-toolchain.toml', '**/.cargo/config.toml', '**/.cargo/config', '!**/target/**', '!artifacts/**') }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: extractions/setup-just@v3
      # cargo-deny is prebuilt; cargo-doc2readme falls back to cargo-binstall.
      - uses: taiki-e/install-action@v2
        if: matrix.lane == 'static'
        with:
          tool: cargo-deny@0.19.0,cargo-doc2readme@0.7.3
      - name: Run gate lane
        working-directory: ${{ env.GATE_WORKSPACE }}
        run: just --timestamp --verbose check-${{ matrix.lane }}
      - name: Packaged-context smoke
        if: matrix.os == 'ubuntu-latest' && matrix.lane == 'ctsc-smoke'
        working-directory: ${{ env.GATE_WORKSPACE }}
        run: just package-smoke

  docs-impact:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check docs impact
        shell: pwsh
        run: ./scripts/docs-impact.ps1 -Base "origin/${{ github.base_ref }}"
