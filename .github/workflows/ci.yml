name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      SPECGATE_CTSC_GOLDENS_BUILD_CACHE: artifacts/ctsc-goldens-build-cache/v2
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            test
      - name: Cache golden build intermediates
        uses: actions/cache@v4
        with:
          path: ${{ env.SPECGATE_CTSC_GOLDENS_BUILD_CACHE }}
          key: ctsc-goldens-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/rust-toolchain.toml', '**/.cargo/config.toml', '**/.cargo/config', '!**/target/**', '!artifacts/**') }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: extractions/setup-just@v3
      - name: Install Rust gate tools
        run: |
          cargo install cargo-deny --version 0.19.0 --locked
          cargo install cargo-doc2readme --locked
      - name: Run complete gate
        run: just --timestamp --verbose check
      - name: Packaged-context smoke
        if: matrix.os == 'ubuntu-latest'
        run: just package-smoke
