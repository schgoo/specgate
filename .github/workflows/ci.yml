name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Each lane is a `just check-<lane>` recipe; `just check` is their union.
  check:
    name: check ${{ matrix.lane }} (${{ matrix.os }})${{ matrix.sdk == '11.0.x' && ' [.NET 11]' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        lane: [rust-replay, rust-other, static, ctsc-smoke, ctsc-goldens]
        sdk: [10.0.x, 11.0.x]
    env:
      SPECGATE_CTSC_GOLDENS_BUILD_CACHE: artifacts/ctsc-goldens-build-cache/v2
      # The rust/target cache stays small; each Rust test run builds children from empty.
      SPECGATE_RUST_TEST_BUILD_DIR: scratch
      # Every CI build starts cold, so full debug info only costs disk and link time.
      # Swatinem/rust-cache already sets CARGO_INCREMENTAL=0.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.lane }}
          workspaces: |
            rust
            test
      - name: Cache golden build intermediates
        if: matrix.lane == 'ctsc-goldens'
        uses: actions/cache@v4
        with:
          path: ${{ env.SPECGATE_CTSC_GOLDENS_BUILD_CACHE }}
          key: ctsc-goldens-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.sdk }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/rust-toolchain.toml', '**/.cargo/config.toml', '**/.cargo/config', '!**/target/**', '!artifacts/**') }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            ${{ matrix.sdk }}
      - name: Select and verify .NET SDK
        shell: pwsh
        run: |
          $major = '${{ matrix.sdk }}'.Split('.')[0]
          $version = dotnet --list-sdks |
            ForEach-Object { ($_ -split ' ')[0] } |
            Where-Object { $_ -match "^$major\.0\.\d+$" } |
            Sort-Object { [version]$_ } |
            Select-Object -Last 1
          if (-not $version) { throw "No stable .NET SDK $major is installed" }
          $selection = @{ sdk = @{ version = $version; rollForward = 'disable'; allowPrerelease = $false } } |
            ConvertTo-Json -Depth 3
          [IO.File]::WriteAllText((Join-Path $PWD 'global.json'),
            $selection.Replace("`r`n", "`n") + "`n", [Text.UTF8Encoding]::new($false))
          $actual = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne $version) {
            throw "Expected .NET SDK $version, selected $actual"
          }
          dotnet --info
      - uses: extractions/setup-just@v3
      - name: Install Rust gate tools
        if: matrix.lane == 'static'
        run: |
          cargo install cargo-deny --version 0.19.0 --locked
          cargo install cargo-doc2readme --locked
      - name: Run gate lane
        run: just --timestamp --verbose check-${{ matrix.lane }}
      - name: Packaged-context smoke
        if: matrix.os == 'ubuntu-latest' && matrix.lane == 'ctsc-smoke'
        run: just package-smoke

  docs-impact:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check docs impact
        shell: pwsh
        run: ./scripts/docs-impact.ps1 -Base "origin/${{ github.base_ref }}"
