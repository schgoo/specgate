name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Each lane is a `just check-<lane>` recipe; `just check` is their union.
  check:
    name: check ${{ matrix.lane }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        lane: [rust-replay, rust-other, static, ctsc-smoke, ctsc-goldens]
    env:
      SPECGATE_CTSC_GOLDENS_BUILD_CACHE: artifacts/ctsc-goldens-build-cache/v2
      # The rust/target cache stays small; each Rust test run builds children from empty.
      SPECGATE_RUST_TEST_BUILD_DIR: scratch
      # Every CI build starts cold, so full debug info only costs disk and link time.
      # Swatinem/rust-cache already sets CARGO_INCREMENTAL=0.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.lane }}
          workspaces: |
            rust
            test
      - name: Cache golden build intermediates
        if: matrix.lane == 'ctsc-goldens'
        uses: actions/cache@v4
        with:
          path: ${{ env.SPECGATE_CTSC_GOLDENS_BUILD_CACHE }}
          key: ctsc-goldens-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/rust-toolchain.toml', '**/.cargo/config.toml', '**/.cargo/config', '!**/target/**', '!artifacts/**') }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: extractions/setup-just@v3
      - name: Install Rust gate tools
        if: matrix.lane == 'static'
        run: |
          cargo install cargo-deny --version 0.19.0 --locked
          cargo install cargo-doc2readme --locked
      - name: Run gate lane
        run: just --timestamp --verbose check-${{ matrix.lane }}
      - name: Inspect failing Weaver analyzer
        if: failure() && runner.os == 'Linux' && matrix.lane == 'rust-other'
        shell: bash
        run: |
          set +e
          diagnostics="$PWD/artifacts/analyzer-diagnostics"
          project="csharp/SpecGate.Weaver/SpecGate.Weaver.csproj"
          source="csharp/SpecGate.Weaver/OperationDeclaration.cs"
          mkdir -p "$diagnostics"
          dotnet --info > "$diagnostics/dotnet-info.txt" 2>&1
          dotnet msbuild "$project" -getProperty:NETCoreSdkVersion,LangVersion,TargetFramework,AnalysisLevel,EnforceCodeStyleInBuild,TreatWarningsAsErrors,RunAnalyzersDuringBuild > "$diagnostics/build-settings.json" 2>&1
          dotnet build "$project" --no-restore --no-incremental --output "$diagnostics/before" -p:UseSharedCompilation=false -p:ReportAnalyzer=true -p:ErrorLog="$diagnostics/analyzers.sarif" > "$diagnostics/build-before.log" 2>&1
          echo "$?" > "$diagnostics/build-before.exit"
          dotnet format style "$project" --diagnostics IDE0028 --include "$source" --no-restore --verbosity detailed --report "$diagnostics" > "$diagnostics/format.log" 2>&1
          echo "$?" > "$diagnostics/format.exit"
          git diff -- "$source" > "$diagnostics/proposed-fix.patch"
          git diff --name-only > "$diagnostics/modified-files.txt"
          find csharp/SpecGate.Weaver/obj -name '*.editorconfig' -exec cp {} "$diagnostics" \;
          dotnet build "$project" --no-restore --no-incremental --output "$diagnostics/after" -p:UseSharedCompilation=false > "$diagnostics/build-after.log" 2>&1
          echo "$?" > "$diagnostics/build-after.exit"
          exit 0
      - name: Upload Weaver analyzer evidence
        if: failure() && runner.os == 'Linux' && matrix.lane == 'rust-other'
        uses: actions/upload-artifact@v4
        with:
          name: weaver-analyzer-diagnostics
          path: |
            artifacts/analyzer-diagnostics/*.txt
            artifacts/analyzer-diagnostics/*.json
            artifacts/analyzer-diagnostics/*.log
            artifacts/analyzer-diagnostics/*.exit
            artifacts/analyzer-diagnostics/*.patch
            artifacts/analyzer-diagnostics/*.sarif
            artifacts/analyzer-diagnostics/*.editorconfig
          retention-days: 7
      - name: Packaged-context smoke
        if: matrix.os == 'ubuntu-latest' && matrix.lane == 'ctsc-smoke'
        run: just package-smoke

  docs-impact:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check docs impact
        shell: pwsh
        run: ./scripts/docs-impact.ps1 -Base "origin/${{ github.base_ref }}"
