name: Release

permissions:
  contents: write

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Publish crates in dependency order
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo package --workspace --no-verify
          cargo publish -p specgate-runtime
          sleep 30
          cargo publish -p specgate-annotations-macros
          sleep 30
          cargo publish -p specgate
          sleep 30
          cargo publish -p specgate-discovery
          sleep 30
          cargo publish -p specgate-ctsc
          sleep 30
          cargo publish -p specgate-cli
      - name: Pack C# annotations
        env:
          SOURCE_DATE_EPOCH: '315532800'
        run: dotnet pack csharp/SpecGate.Annotations/SpecGate.Annotations.csproj -c Release -p:ContinuousIntegrationBuild=true -o artifacts/nuget
      - name: Publish C# annotations
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: specgate-linux-x86_64
            exe: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: specgate-windows-x86_64
            exe: '.exe'
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: specgate-macos-aarch64
            exe: ''
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.target }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build release binary
        working-directory: rust
        run: cargo build --release -p specgate-cli --target ${{ matrix.target }}
      # C# discovery runs the prebuilt SpecGate.Discovery tool from beside the
      # specgate executable, so the uploaded artifact is that whole layout: the
      # CLI plus the tool's framework-dependent publish output, including its
      # runtime configuration and dependency manifest.
      - name: Assemble the install layout
        shell: pwsh
        run: |
          dotnet publish csharp/SpecGate.Discovery/SpecGate.Discovery.csproj -c Release --no-self-contained -o dist
          Copy-Item "rust/target/${{ matrix.target }}/release/specgate${{ matrix.exe }}" dist
      - name: Run C# discovery from the install layout
        shell: pwsh
        run: |
          ./dist/specgate${{ matrix.exe }} discover --binding test/bindings/specgate.yaml `
            --component fixture.stateless_add `
            --impl csharp `
            --registry-id urn:ctsc:registry:fixture.stateless_add `
            --registry-version 0.1.0 `
            --out dist-discovery.json
      - name: Upload install layout
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: dist
