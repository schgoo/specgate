# yaml-language-server: $schema=../spec-schema.json
spec_version: "0.4.0"
name: specgate.ctsc
binding: ../bindings/rust-ctsc.yaml

operations:
  translate_legacy_trace:
    desc: >
      Translate one legacy flat operation trace into its CTSC semantic
      projection. Input echoes become operation inputs, ordinary events become
      observations, and the terminal legacy event selects the CTSC completion
      state.
    inputs:
      scenario_name: string
      component_id: string
      legacy_trace_json: string
    outputs:
      - scenario_name: string
      - component_id: string
      - operation_name: string
      - inputs_json: string
      - observations_json: string
      - completion: string
      - completion_value_json: string

  encode_legacy_trace_otlp:
    desc: >
      Translate one legacy operation trace and encode it as a complete CTSC
      OTLP JSON document. Invocation identity and time are supplied by the
      caller so production capture can use unique values while tests remain
      deterministic.
    inputs:
      scenario_name: string
      component_id: string
      legacy_trace_json: string
      trace_id: string
      run_span_id: string
      scenario_span_id: string
      operation_span_id: string
      run_id: string
      start_time_unix_nano: i64
      tool_version: string
      target_name: string
      target_language: string
    outputs:
      - otlp_json: string
      - span_count: i32

  encode_discovery_registry:
    desc: >
      Convert one component from SpecGate discovery metadata into a
      deterministic CTSC registry document. The first slice covers non-setup
      operations whose inputs and result use CTSC primitive types.
    inputs:
      registry_id: string
      registry_version: string
      component_id: string
      discovery_json: string
    outputs:
      - registry_json: string
      - operation_count: i32
      - type_count: i32

  encode_schema_registry:
    desc: >
      Convert one normalized, setup-folded implementation schema into a
      deterministic CTSC registry component. Supports named records and tagged
      unions plus list, set, map, tuple, and option-like type references.
    inputs:
      registry_id: string
      registry_version: string
      schema_json: string
    outputs:
      - registry_json: string
      - operation_count: i32
      - type_count: i32

cases:
  - name: stateless_result
    desc: Input echoes are removed from observations and projected onto the operation inputs.
    operation: translate_legacy_trace
    inputs:
      scenario_name: add_2_3
      component_id: fixture.stateless_add
      legacy_trace_json: >
        [{"kind":"Run","operation":"add"},
        {"kind":"Event","name":"add.a","value":2},
        {"kind":"Event","name":"add.b","value":3},
        {"kind":"Event","name":"$result","value":5}]
    expected:
      - scenario_name: add_2_3
      - component_id: fixture.stateless_add
      - operation_name: add
      - inputs_json: '{"a":2,"b":3}'
      - observations_json: '{}'
      - completion: result
      - completion_value_json: "5"

  - name: observed_no_result
    desc: Ordinary events become observations and an operation may complete without a result channel.
    operation: translate_legacy_trace
    inputs:
      scenario_name: records_total
      component_id: fixture.observation
      legacy_trace_json: >
        [{"kind":"Run","operation":"record_total"},
        {"kind":"Event","name":"record_total.amount","value":7},
        {"kind":"Event","name":"total","value":7}]
    expected:
      - scenario_name: records_total
      - component_id: fixture.observation
      - operation_name: record_total
      - inputs_json: '{"amount":7}'
      - observations_json: '{"total":7}'
      - completion: none
      - completion_value_json: ""

  - name: unexpected_fault
    desc: A legacy fault becomes a CTSC fault rather than a declared completion outcome.
    operation: translate_legacy_trace
    inputs:
      scenario_name: crashes
      component_id: fixture.fault
      legacy_trace_json: >
        [{"kind":"Run","operation":"explode"},
        {"kind":"Event","name":"explode.code","value":9},
        {"kind":"Event","name":"$fault","value":"boom"}]
    expected:
      - scenario_name: crashes
      - component_id: fixture.fault
      - operation_name: explode
      - inputs_json: '{"code":9}'
      - observations_json: '{}'
      - completion: fault
      - completion_value_json: '"boom"'

  - name: preserve_single_entry_map
    desc: A semantic map whose key resembles a legacy type name remains a map.
    operation: translate_legacy_trace
    inputs:
      scenario_name: records_metric
      component_id: fixture.observation
      legacy_trace_json: >
        [{"kind":"Run","operation":"record_metric"},
        {"kind":"Event","name":"metric","value":{"Integer":7}}]
    expected:
      - scenario_name: records_metric
      - component_id: fixture.observation
      - operation_name: record_metric
      - inputs_json: '{}'
      - observations_json: '{"metric":{"Integer":7}}'
      - completion: none
      - completion_value_json: ""

  - name: encode_stateless_result_as_otlp
    desc: A translated result becomes a valid three-span CTSC OTLP trace.
    operation: encode_legacy_trace_otlp
    inputs:
      scenario_name: add_2_3
      component_id: fixture.stateless_add
      legacy_trace_json: >
        [{"kind":"Run","operation":"add"},
        {"kind":"Event","name":"add.a","value":2},
        {"kind":"Event","name":"add.b","value":3},
        {"kind":"Event","name":"$result","value":5}]
      trace_id: "11111111111111111111111111111111"
      run_span_id: "1111111111111101"
      scenario_span_id: "1111111111111102"
      operation_span_id: "1111111111111103"
      run_id: run-001
      start_time_unix_nano: 1000000000
      tool_version: 0.5.0
      target_name: rust-reference
      target_language: rust
    expected:
      - span_count: 3
      - otlp_json:
          $matches: '"name":"conformance.run".*"name":"conformance.scenario".*"conformance.scenario.name".*"add_2_3".*"name":"conformance.operation".*"conformance.component.id".*"fixture.stateless_add".*"conformance.operation.name".*"add".*"conformance.operation.inputs".*"a".*"intValue":"2".*"b".*"intValue":"3".*"name":"conformance.result".*"conformance.result.value".*"intValue":"5"'

  - name: encode_stateless_discovery_as_registry
    desc: Stateless primitive discovery metadata becomes a valid CTSC registry component.
    operation: encode_discovery_registry
    inputs:
      registry_id: urn:ctsc:registry:fixture.stateless-add:1
      registry_version: 1.0.0
      component_id: fixture.stateless_add
      discovery_json: >
        {"operations":[{"name":"add","is_setup":false,"is_async":false,
        "return_type":"i32","fills":"","component":"fixture.stateless_add",
        "params":[["a","i32"],["b","i32"]]}],"types":[]}
    expected:
      - operation_count: 1
      - type_count: 0
      - registry_json:
          $matches: '"format":"ctsc.registry".*"formatVersion":"0.1.0".*"registryId":"urn:ctsc:registry:fixture.stateless-add:1".*"version":"1.0.0".*"components".*"id":"fixture.stateless_add".*"operations".*"name":"add".*"inputs".*"name":"a".*"kind":"primitive".*"name":"i32".*"name":"b".*"kind":"primitive".*"name":"i32".*"observations":\[\].*"outcomes".*"result".*"kind":"primitive".*"name":"i32".*"types":\[\]'

  - name: encode_rich_normalized_schema_as_registry
    desc: >
      A normalized schema preserves named records and tagged unions while
      recursively projecting every supported collection and option shape.
    operation: encode_schema_registry
    inputs:
      registry_id: urn:ctsc:registry:fixture.rich:1
      registry_version: 1.0.0
      schema_json: >
        {"component":"fixture.rich","operations":[{"name":"transform",
        "is_async":false,"inputs":[{"name":"person","ty":"Person"},
        {"name":"points","ty":"List<Point>"},{"name":"tags","ty":"set<string>"},
        {"name":"scores","ty":"map<string, i64>"},
        {"name":"pair","ty":"tuple<i32, string>"},
        {"name":"fallback","ty":"Option<Point>"}],"output":"Shape"}],
        "types":[{"name":"Person","kind":"struct","fields":[
        {"name":"name","ty":"string"},{"name":"location","ty":"Point"}],
        "variants":[]},{"name":"Point","kind":"struct","fields":[
        {"name":"x","ty":"i32"},{"name":"y","ty":"i32"}],"variants":[]},
        {"name":"Shape","kind":"enum","fields":[],"variants":[
        {"name":"Circle","fields":[{"name":"radius","ty":"i32"}]},
        {"name":"Rectangle","fields":[{"name":"width","ty":"i32"},
        {"name":"height","ty":"i32"}]},{"name":"Point","fields":[]}]}]}
    expected:
      - operation_count: 1
      - type_count: 3
      - registry_json:
          $matches: '"id":"fixture.rich".*"name":"transform".*"name":"person".*"kind":"named".*"name":"Person".*"name":"points".*"kind":"list".*"kind":"named".*"name":"Point".*"name":"tags".*"kind":"set".*"name":"string".*"name":"scores".*"kind":"map".*"name":"pair".*"kind":"tuple".*"name":"fallback".*"kind":"tagged_union".*"name":"None".*"name":"Some".*"name":"Shape".*"types".*"name":"Person".*"kind":"record".*"name":"location".*"kind":"named".*"name":"Point".*"name":"Shape".*"kind":"tagged_union".*"name":"Circle".*"kind":"record".*"name":"radius".*"name":"Rectangle".*"name":"width".*"name":"height".*"name":"Point"'
