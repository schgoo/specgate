# yaml-language-server: $schema=../spec-schema.json
# SpecGate component: specgate.harness
#
# The unified harness. Compiles annotated code, runs operations, collects
# traces, and compares against expected assertions.
#
# Trace matching rules:
#   - Ordered assertions matched as subsequence (gaps allowed)
#   - "$run: operation" matches a Run event
#   - "name: value" matches an Event with that name and value
#   - "$unordered: [...]" — all items must appear, any order, between surrounding ordered items
#   - "$anywhere: [...]" — items must appear somewhere in the trace, position irrelevant

spec_version: "0.4.0"
name: specgate.harness
binding: bindings/rust.yaml
target: run_spec

types:
  # `value` is a built-in spec type: the universal structured trace value —
  # any scalar, or a list/map/set of `value`. The matcher compares scalars
  # type-exactly except int/float numeric equivalence; lists use subsequence
  # (or $unordered), maps check key+value, sets check presence. A null/None
  # field is represented by the absence of its event. (Previously
  # hand-modelled here as a `Value` oneof;
  # it is now a built-in because the runtime `Value` is the spec's own value
  # lattice and cannot itself be a SpecEvent.)

  TraceEvent:
    oneof:
      Event: { span: string, name: string, value: value }
      Run: { span: string, operation: string }

  Assertion:
    desc: >
      Expected assertions support exact values, structured values
      (lists, maps), and $-operators for flexible matching.
    oneof:
      Event: { name: string, value: value }
      $run: { operation: string }
      $unordered: { items: List<Assertion> }
      $anywhere: { items: List<Assertion> }

  Source:
    assertion_ids: List<string>
    spec: string
    section: string

  CaseResult:
    name: string
    status:
      oneof: [pass, fail, skip, warn]
    kind:
      oneof: [standard, property]
      default: standard
    level:
      oneof: [must, should, may]
    source: Source  # optional
    # Standard case fields
    expected: List<Assertion>
    traces: List<TraceEvent>  # the canonical trace every bound target must produce; on pass, what all targets emitted
    # Multi-target conformance (only when a spec has multiple bindings)
    target_failures: List<TargetFailure>  # optional — present only for targets whose traces diverge from `traces`
    # Property case fields (only when kind: property)
    counterexample: Map<string, value>  # generator values that caused failure (only on fail)
    # traces: included on property fail — the trace from the counterexample run

  TargetFailure:
    target: string  # the binding target (e.g. csharp) whose traces diverged
    traces: List<TraceEvent>  # what this target actually produced
    mismatch: string  # human-readable description of the first divergence

operations:
  run_spec:
    desc: Run all test cases in a spec file and return results with traces.
    inputs:
      spec:
        type: string
        desc: Path to the spec YAML file (relative to repo root)
    outputs:
      - outcome:
          oneof:
            Complete:
              results: List<CaseResult>
            Error:
              reason: string

  mechanism_proof:
    kind: command
    desc: >
      Compile fixtures and verify annotations emit real traces.
      Runs cargo test --test mechanism_proof.
    outputs:
      - outcome:
          oneof:
            Complete: {}
            Error: {}

  check_fixtures:
    kind: command
    desc: >
      Verify that the specgate-fixtures crate compiles with current annotations.
      Runs cargo check on the fixtures crate.
    outputs:
      - outcome:
          oneof:
            Complete: {}
            Error: {}

cases:

  # ================================================================
  # Mechanism constraints
  # ================================================================

  - name: harness_compiles_and_emits_traces
    operation: mechanism_proof
    target: mechanism_proof
    desc: >
      Annotations expand into real trace-emitting code at compile time.
      Calling annotated functions and checking traces proves compilation
      happened and macros are not no-ops.
    expected:
      - $outcome: "Complete"

  - name: fixtures_compile
    operation: check_fixtures
    target: check_fixtures
    desc: >
      The specgate-fixtures crate must compile with the current annotations.
      This forces the annotations crate to handle #[derive(SpecEvent)],
      #[spec_operation], #[spec_setup], #[spec_mock], and spec_trace!.
    expected:
      - $outcome: "Complete"

  - name: discovery_registry_handles_methods_and_duplicates
    kind: narrative
    desc: >
      Annotation metadata discovery must register free functions, method
      operations, and setups without compile failures, even when multiple
      source files reuse the same operation name. The discovery JSON exposed
      by the runtime must stay valid and include those registered entries.
    verify:
      - Method operations annotated inside impl blocks compile successfully and register metadata
      - #[spec_setup] functions register metadata with is_setup: true
      - Reusing the same operation name in different source files does not cause registry symbol collisions
      - specgate_runtime::discovery_json() returns valid JSON listing the registered operations

  - name: command_target_executes_binding_command
    kind: narrative
    desc: >
      A spec whose binding selects a command target is verified by running that
      shell command and checking its exit status (exit 0 = pass), not by
      compiling and tracing a source file. The command_target fixture
      (binding_command.yaml, target: check, operation kind: command) covers
      this path. Note: run_spec resolves a source file and therefore does not
      execute command targets — they are exercised through the CLI run path.
    verify:
      - The command_target fixture's check operation is declared kind:command
      - A command target passes when its shell command exits 0
      - run_spec is source-oriented and does not execute command targets

  - name: multi_file_operations
    kind: narrative
    desc: >
      A single spec may define operations that live in different source
      files. The harness must discover and run every operation the spec
      references, regardless of which file each one is defined in.
    verify:
      - The multi_file fixture spec completes with all cases passing
      - Operations greet and farewell, defined in separate files, are both invoked
      - No case is skipped for a missing-source reason

  - name: no_source_interpretation
    kind: narrative
    desc: >
      The harness must not interpret Rust source with syn. It must shell out
      to cargo to compile and run annotated code. An earlier implementation
      used source interpretation as a shortcut — it passed all spec-driven
      tests but could not handle real-world code.
    verify:
      - No syn-based expression evaluation exists in harness source
      - The harness invokes cargo build/test, never evaluates Rust in-process

  - name: operation_name_reused_across_components_resolves_a
    desc: >
      The harness resolves each operation via the extracted registry metadata
      keyed on (component, operation), where the component is the spec's own
      name — not by scanning file names or a shallowest-path tiebreak. This
      fixture and resolver_b both define an operation named `render` in
      DIFFERENT components; run_spec on this spec must resolve THIS component's
      `render` (returns "from A"). Under the old scan-based resolution the
      duplicate name is ambiguous; under (component, operation) it is exact.
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/resolver_a.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: renders
                status: pass
                expected:
                  - $result: "from A"
                traces:
                  - Run: { operation: render }
                  - Event: { name: $result, value: "from A" }

  - name: operation_name_reused_across_components_resolves_b
    desc: >
      Companion to resolver_a: the same `render` operation name in a second
      component resolves to ITS own source (returns "from B"), proving the two
      never cross-contaminate.
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/resolver_b.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: renders
                status: pass
                expected:
                  - $result: "from B"
                traces:
                  - Run: { operation: render }
                  - Event: { name: $result, value: "from B" }

  - name: duplicate_operation_in_component_is_error
    desc: >
      Operation names must be unique within a component. The resolver_conflict
      fixture defines two operations both named `render` in ONE component;
      because resolution is keyed on (component, operation) that pair is
      unresolvable, so run_spec must return a hard error naming the duplicate
      rather than silently picking one. (Message text is best-effort; reconcile
      the exact bytes during implementation.)
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/resolver_conflict.spec.yaml
    expected:
      - $result:
          Error:
            reason: "operation 'render' is defined more than once in component 'fixture.resolver_conflict'"

  - name: operation_inputs_emitted
    kind: narrative
    desc: >
      Every input parameter of an operation must be emitted to the trace as an
      `op.param` event, including complex inputs (structs, enums, lists, maps).
      A single non-primitive parameter must not suppress emission of the other
      parameters. This lets specs assert on what an operation received, not just
      what it produced.
    verify:
      - Complex (struct/enum/list/map) input parameters appear as op.param events
      - Primitive parameters are still emitted even when a sibling parameter is complex
      - Run complex_inputs.spec.yaml — input-echo expectations on lookup, describe_config, and describe_person pass

  - name: structured_values_not_stringified
    kind: narrative
    desc: >
      Collection fields (Vec, BTreeMap, BTreeSet) annotated with #[spec_event]
      must emit structured Value events (Value::List, Value::Map, Value::Set),
      not stringified representations. The codegen must use emit_event_v (or
      equivalent structured emission) for these types. Using format!("{}", x)
      to stringify a Vec into "["a", "b"]" is incorrect — the matcher cannot
      apply $size, $contains, $any operators on a plain string.
    verify:
      - 'Run structured_output.spec.yaml — list_exact_match expects value: ["ID"]'
      - 'If the trace contains value: "[\"ID\"]" (a string), matching will fail'

  - name: crate_dependency_not_path_include
    kind: narrative
    desc: >
      The generated runner must depend on the fixture crate as a Cargo
      dependency (in [dependencies] of the generated Cargo.toml), not use
      #[path = "..."] mod inclusion. #[path] inclusion breaks when the
      fixture uses external crate dependencies, cross-module imports, or
      build script generated code. The cross_dep fixture uses serde_yaml
      which is impossible to resolve via #[path] inclusion.
    verify:
      - Run cross_dep.spec.yaml — it uses serde_yaml
      - Check generated Cargo.toml has specgate-fixtures in [dependencies]
      - Generated main.rs uses "use specgate_fixtures::..." not "#[path]"

  - name: operators_work_on_structured_values
    kind: narrative
    desc: >
      Assertion operators ($size, $contains, $containsAll, $any, $every,
      $match, $excludes) operate on structured Value types, not strings.
      The matcher must parse the expected operator syntax and apply it
      against the actual Value in the trace event. String equality is
      only the default for scalar values without operators.
    verify:
      - Run operators.spec.yaml — $size on a list Value works
      - Run scalar_operators.spec.yaml — $gt on an integer Value works
      - A string value "3" does not satisfy $size: 3 (type mismatch)

  - name: generated_runner_uses_version_deps_from_crates_io
    kind: narrative
    desc: >
      When specgate-harness is installed from crates.io (not a path
      dependency), the generated runner Cargo.toml must use version
      dependencies (e.g. specgate-annotations = "0.1.1") instead of
      path dependencies. Path deps point to the registry cache which
      has no workspace structure. The harness detects whether it is
      running from a local workspace or from crates.io and adjusts
      the generated manifest accordingly.
    verify:
      - codegen with is_local=false produces version deps in the manifest
      - The version matches the harness crate's own version

  - name: umbrella_crate_re_exports_annotations_path
    kind: narrative
    desc: >
      The specgate umbrella crate must re-export specgate_annotations
      such that the path ::specgate_annotations resolves for any crate
      depending on specgate. The proc macros expand to
      ::specgate_annotations::__rt::emit_event(...) and this path must
      compile whether the user depends on specgate or specgate-annotations
      directly.
    verify:
      - specgate/src/lib.rs contains pub extern crate specgate_annotations
      - A crate depending only on specgate compiles with spec_operation

  - name: paths_resolve_relative_to_spec
    desc: >
      Spec at a deeply nested path resolves binding and fixture source
      correctly. Tests that the harness absolutizes paths before embedding
      them in the generated runner, so the runner finds files regardless
      of its own working directory.
    operation: run_spec
    inputs:
      spec: test/fixtures/nested/deep/path/nested_path.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: add_from_nested_path
                status: pass
                expected:
                  - $result: 30
                traces:
                  - Run: { operation: add }
                  - Event: { name: add.a, value: 10 }
                  - Event: { name: add.b, value: 20 }
                  - Event: { name: $result, value: 30 }

  - name: target_selection
    desc: >
      Spec with target: alt selects a different crate than the default.
      Proves the harness dispatches to the correct binding target.
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/target_selection.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: greet_world
                status: pass
                expected:
                  - $result: "Hello, World!"
                traces:
                  - Run: { operation: greet }
                  - Event: { name: greet.name, value: "World" }
                  - Event: { name: $result, value: "Hello, World!" }

  - name: per_case_target_override
    desc: >
      One spec with two cases using different targets. First case uses
      default target (add from fixtures), second overrides to alt (greet
      from fixtures-alt).
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/per_case_target.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: add_from_default
                status: pass
                expected:
                  - $result: 3
                traces:
                  - Run: { operation: add }
                  - Event: { name: add.a, value: 1 }
                  - Event: { name: add.b, value: 2 }
                  - Event: { name: $result, value: 3 }
              - name: greet_from_alt
                status: pass
                expected:
                  - $result: "Hello, Test!"
                traces:
                  - Run: { operation: greet }
                  - Event: { name: greet.name, value: "Test" }
                  - Event: { name: $result, value: "Hello, Test!" }

  - name: missing_target_error
    desc: Spec references a target that doesn't exist in the binding
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/missing_target.spec.yaml
    expected:
      - $result:
          Error:
            reason: "target 'nonexistent' not found in binding"

  - name: matching_behaviors
    desc: >
      Consolidated matcher / mismatch / subsequence / unordered behavior tests,
      run against the fixture.matching component's own vehicle operations. Each
      case's pass/fail status is asserted; failing cases prove the harness does
      not vacuously pass wrong/missing/mis-ordered assertions, passing cases
      prove correct subsequence / unordered matching.
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/matching.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - { name: wrong_value_fails, status: fail }
              - { name: wrong_run_fails, status: fail }
              - { name: add_2_3, status: fail }
              - { name: wrong_order_increment_once, status: fail }
              - { name: counter_wrong_increment_once, status: fail }
              - { name: increment_then_decrement, status: fail }
              - { name: double_increment, status: pass }
              - { name: unordered_both_present, status: pass }
              - { name: unordered_reversed_still_passes, status: pass }
              - { name: unordered_wrong_value_fails, status: fail }
              - { name: unordered_multiple_blocks, status: pass }
              - { name: withdraw_50, status: pass }

  - name: self_test_rejects_all_errors
    desc: >
      When the harness runs its own spec and every run_spec call returns
      an error (e.g. file not found), the self-test must fail — it must
      not pass vacuously.
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/engine_minimal.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: probe_returns_one
                status: pass
                expected:
                  - $result: 1
                traces:
                  - Run: { operation: probe }
                  - Event: { name: $result, value: 1 }

  # ================================================================
  # Type-exact matching — scalar equality must NOT coerce across types.
  # The three *_fails cases assert a value of the wrong type against the
  # trace and MUST fail; they only pass under a (wrong) type-lenient matcher.
  # ================================================================

  - name: type_exact_matching
    desc: Scalar assertions are type-exact; cross-type assertions fail
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/type_exact.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: int_exact
                status: pass
                expected:
                  - count: 5
                traces:
                  - Run: { operation: get_scalars }
                  - Event: { name: count, value: 5 }
                  - Event: { name: enabled, value: true }
                  - Event: { name: code, value: "7" }
                  - Event: { name: $result, value: { code: "7", count: 5, enabled: true } }
              - name: int_as_string_fails
                status: fail
                expected:
                  - count: '5'
                traces:
                  - Run: { operation: get_scalars }
                  - Event: { name: count, value: 5 }
                  - Event: { name: enabled, value: true }
                  - Event: { name: code, value: "7" }
                  - Event: { name: $result, value: { code: "7", count: 5, enabled: true } }
              - name: bool_exact
                status: pass
                expected:
                  - enabled: true
                traces:
                  - Run: { operation: get_scalars }
                  - Event: { name: count, value: 5 }
                  - Event: { name: enabled, value: true }
                  - Event: { name: code, value: "7" }
                  - Event: { name: $result, value: { code: "7", count: 5, enabled: true } }
              - name: bool_as_string_fails
                status: fail
                expected:
                  - enabled: 'true'
                traces:
                  - Run: { operation: get_scalars }
                  - Event: { name: count, value: 5 }
                  - Event: { name: enabled, value: true }
                  - Event: { name: code, value: "7" }
                  - Event: { name: $result, value: { code: "7", count: 5, enabled: true } }
              - name: string_exact
                status: pass
                expected:
                  - code: '7'
                traces:
                  - Run: { operation: get_scalars }
                  - Event: { name: count, value: 5 }
                  - Event: { name: enabled, value: true }
                  - Event: { name: code, value: "7" }
                  - Event: { name: $result, value: { code: "7", count: 5, enabled: true } }
              - name: string_as_int_fails
                status: fail
                expected:
                  - code: 7
                traces:
                  - Run: { operation: get_scalars }
                  - Event: { name: count, value: 5 }
                  - Event: { name: enabled, value: true }
                  - Event: { name: code, value: "7" }
                  - Event: { name: $result, value: { code: "7", count: 5, enabled: true } }

  # ================================================================
  # Async runtime selection — Rust reactor (tokio/smol)
  # ================================================================

  - name: async_smol_timer_completes
    desc: Reactor-backed async op (smol timer) runs to completion under the default smol runtime entry.
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/async_smol_timer.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: smol_delay_completes
                status: pass

  - name: async_tokio_timer_completes
    desc: "Reactor-backed async op (tokio timer) runs under a tokio runtime (binding runtime: tokio)."
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/async_tokio_timer.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: tokio_delay_completes
                status: pass

  # ================================================================
  # Mismatch — failures detected
  # ================================================================

  - name: mismatch_wrong_field_name
    desc: Asserting on an output name the operation does not declare is a schema error
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/mismatch_wrong_field.spec.yaml
    expected:
      - $result:
          Error:
            reason: "expected event 'total' is not a declared output of operation 'increment'"

  # ================================================================
  # Matching directives — $unordered, $anywhere, $run collision
  # ================================================================

  - name: anywhere_event_matching
    desc: $anywhere matches events regardless of position in trace
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/anywhere_event.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: anywhere_matches_early_event
                status: pass
                expected:
                  - $run: increment_twice
                  - count: 2
                  - $anywhere:
                    - count: 0
                traces:
                  - Event: { name: count, value: 0 }
                  - Run: { operation: increment_twice }
                  - Event: { name: count, value: 1 }
                  - Event: { name: count, value: 2 }
              - name: anywhere_matches_late_event
                status: pass
                expected:
                  - count: 0
                  - $run: increment_twice
                  - $anywhere:
                    - count: 2
                traces:
                  - Event: { name: count, value: 0 }
                  - Run: { operation: increment_twice }
                  - Event: { name: count, value: 1 }
                  - Event: { name: count, value: 2 }
              - name: anywhere_matches_middle_event
                status: pass
                expected:
                  - $anywhere:
                    - count: 1
                  - $run: increment_twice
                  - count: 2
                traces:
                  - Event: { name: count, value: 0 }
                  - Run: { operation: increment_twice }
                  - Event: { name: count, value: 1 }
                  - Event: { name: count, value: 2 }
              - name: anywhere_multiple_items
                status: pass
                expected:
                  - $anywhere:
                    - count: 0
                    - count: 1
                    - count: 2
                traces:
                  - Event: { name: count, value: 0 }
                  - Run: { operation: increment_twice }
                  - Event: { name: count, value: 1 }
                  - Event: { name: count, value: 2 }
              - name: anywhere_missing_fails
                status: fail
                expected:
                  - $anywhere:
                    - count: 999
                traces:
                  - Event: { name: count, value: 0 }
                  - Run: { operation: increment_twice }
                  - Event: { name: count, value: 1 }
                  - Event: { name: count, value: 2 }

  - name: keyword_collision_operation_named_run
    desc: Operation named "run" works with $run prefix — no collision
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/keyword_collision.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: operation_named_run
                status: pass
                expected:
                  - $run: run
                  - $result: "executed: test"
                traces:
                  - Run: { operation: run }
                  - Event: { name: run.input, value: "test" }
                  - Event: { name: $result, value: "executed: test" }

  # ================================================================
  # Normative strength — level: must/should/may
  # ================================================================

  - name: provenance_passes_through
    desc: Source metadata and level are included in CaseResult
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/provenance_example.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: add_with_provenance
                status: pass
                level: must
                source:
                  assertion_ids: [TEST-A1, TEST-A2]
                  spec: "Test Specification v1.0"
                  section: "§3.1"
                expected:
                  - $result: 5
                traces:
                  - Run: { operation: add }
                  - Event: { name: add.a, value: 2 }
                  - Event: { name: add.b, value: 3 }
                  - Event: { name: $result, value: 5 }

  - name: level_may_missing_skips
    desc: MAY operation not implemented — case is skipped, not an error
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/level_may_missing.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: optional_not_implemented
                status: skip
                expected: []
                traces: []

  - name: level_should_missing_warns
    desc: SHOULD operation not implemented — case produces warning status
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/level_should_missing.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: recommended_not_implemented
                status: warn
                expected: []
                traces: []

  # ================================================================
  # Error cases
  # ================================================================

  - name: error_bad_yaml
    desc: Invalid YAML produces an error
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/bad_yaml.spec.yaml
    expected:
      - $result:
          Error:
            reason: "spec file is not valid YAML"

  - name: error_bad_binding
    desc: Nonexistent binding produces an error
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/bad_binding.spec.yaml
    expected:
      - $result:
          Error:
            reason: "binding 'nonexistent' not found"

  - name: error_missing_setup
    desc: A method operation whose receiver type has no linked setup
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/missing_setup.spec.yaml
    expected:
      - $result:
          Error:
            reason: "case 'increment_once': operation 'increment' is a method on 'Counter' but no #[spec_setup(\"increment\")] returns 'Counter' to construct the receiver"

  - name: error_missing_operation
    desc: Operation not found in source annotations
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/missing_operation.spec.yaml
    expected:
      - $result:
          Error:
            reason: "operation 'increment' not found in source annotations"

  - name: error_compile_failure
    desc: Source has a syntax error; the reason includes the compiler diagnostics
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/compile_error.spec.yaml
    expected:
      - $result:
          Error:
            reason:
