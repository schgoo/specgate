  # ================================================================
  # Complex inputs — structured YAML deserialized into typed params
  # ================================================================

  # Every operation input parameter is emitted to the trace as an `op.param`
  # event — including complex inputs (struct/enum/list/map) — so specs can assert
  # what an operation received, not only what it produced. A complex parameter
  # must not suppress emission of its primitive siblings (e.g. lookup's map + key).
  - name: complex_input_deserialization
    desc: >
      When a spec case input is a YAML Mapping or Sequence, and the
      operation's parameter type derives SpecEvent (which implies
      Deserialize), the harness deserializes the YAML directly into
      the typed parameter. Operations transform the input to prove
      deserialization worked. Covers: struct, enum, list, map,
      optional, and nested struct — both input and output directions.
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/complex_inputs.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: create_enum_with_members
                status: pass
              - name: sum_two_points
                status: pass
              - name: sum_three_points
                status: pass
              - name: nested_config_object
                status: pass
              - name: area_of_circle
                status: pass
              - name: area_of_rectangle
                status: pass
              - name: area_of_point
                status: pass
              - name: classify_circle
                status: pass
              - name: classify_rectangle
                status: pass
              - name: classify_point
                status: pass
              - name: get_three_points
                status: pass
              - name: lookup_in_map
                status: pass
              - name: invert_string_int_map
                status: pass
              - name: greet_with_name
                status: pass
              - name: greet_without_name
                status: pass
              - name: find_point_exists
                status: pass
              - name: find_point_missing
                status: pass
              - name: find_shape_some_circle
                status: pass
                expected:
                  - $result: { Some: { Circle: { radius: 5 } } }
                traces:
                  - Run: { operation: find_shape }
                  - Event: { name: find_shape.sides, value: 1 }
                  - Event: { name: $result, value: { Some: { Circle: { radius: 5 } } } }
              - name: find_shape_some_point
                status: pass
                expected:
                  - $result: { Some: { Point: {} } }
                traces:
                  - Run: { operation: find_shape }
                  - Event: { name: find_shape.sides, value: 0 }
                  - Event: { name: $result, value: { Some: { Point: {} } } }
              - name: find_shape_none
                status: pass
                expected:
                  - $result: { None: {} }
                traces:
                  - Run: { operation: find_shape }
                  - Event: { name: find_shape.sides, value: -1 }
                  - Event: { name: $result, value: { None: {} } }
              - name: describe_person_with_address
                status: pass
              - name: create_person_struct
                status: pass
