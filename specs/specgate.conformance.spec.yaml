# yaml-language-server: $schema=../spec-schema.json
# SpecGate component: specgate.conformance
#
# Cross-language conformance ledger. Each case runs a dual-bound fixture
# through the harness and asserts every bound target emits a byte-identical
# canonical trace. Split out of the engine spec (specgate.harness) so
# operation-shape coverage across targets is tracked independently of
# harness-mechanism behavior.
#
# Trace matching rules:
#   - Ordered assertions matched as subsequence (gaps allowed)
#   - "$run: operation" matches a Run event
#   - "name: value" matches an Event with that name and value
#   - "$unordered: [...]" — all items must appear, any order, between surrounding ordered items
#   - "$anywhere: [...]" — items must appear somewhere in the trace, position irrelevant

spec_version: "0.4.0"
name: specgate.conformance
binding: bindings/rust.yaml
target: run_spec

types:
  # `value` is a built-in spec type: the universal structured trace value —
  # any scalar, or a list/map/set of `value`. The matcher compares scalars
  # type-exactly except int/float numeric equivalence; lists use subsequence
  # (or $unordered), maps check key+value, sets check presence. A null/None
  # field is represented by the absence of its event. (Previously
  # hand-modelled here as a `Value` oneof;
  # it is now a built-in because the runtime `Value` is the spec's own value
  # lattice and cannot itself be a SpecEvent.)

  TraceEvent:
    oneof:
      Event: { span: string, name: string, value: value }
      Run: { span: string, operation: string }

  Assertion:
    desc: >
      Expected assertions support exact values, structured values
      (lists, maps), and $-operators for flexible matching.
    oneof:
      Event: { name: string, value: value }
      $run: { operation: string }
      $unordered: { items: List<Assertion> }
      $anywhere: { items: List<Assertion> }

  Source:
    assertion_ids: List<string>
    spec: string
    section: string

  CaseResult:
    name: string
    status:
      oneof: [pass, fail, skip, warn]
    kind:
      oneof: [standard, property]
      default: standard
    level:
      oneof: [must, should, may]
    source: Source  # optional
    # Standard case fields
    expected: List<Assertion>
    traces: List<TraceEvent>  # the canonical trace every bound target must produce; on pass, what all targets emitted
    # Multi-target conformance (only when a spec has multiple bindings)
    target_failures: List<TargetFailure>  # optional — present only for targets whose traces diverge from `traces`
    # Property case fields (only when kind: property)
    counterexample: Map<string, value>  # generator values that caused failure (only on fail)
    # traces: included on property fail — the trace from the counterexample run

  TargetFailure:
    target: string  # the binding target (e.g. csharp) whose traces diverged
    traces: List<TraceEvent>  # what this target actually produced
    mismatch: string  # human-readable description of the first divergence

operations:
  run_spec:
    desc: Run all test cases in a spec file and return results with traces.
    inputs:
      spec:
        type: string
        desc: Path to the spec YAML file (relative to repo root)
    outputs:
      - outcome:
          oneof:
            Complete:
              results: List<CaseResult>
            Error:
              reason: string

cases:

  # ================================================================
  # External dependency — operation using a third-party crate
  # ================================================================

  - name: cross_crate_dependency
    desc: >
      Operation uses an external crate (serde_yaml). The harness must
      depend on the fixture crate as a Cargo dependency, not #[path]
      include the source file. This proves the harness handles real
      crate structures with external dependencies.
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/cross_dep.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: extract_yaml_value
                status: pass
                expected:
                  - $result: "Customer"
                traces:
                  - Run: { operation: parse_yaml_key }
                  - Event: { name: parse_yaml_key.input, value: "name: Customer\nid: 42" }
                  - Event: { name: parse_yaml_key.key, value: "name" }
                  - Event: { name: $result, value: "Customer" }

  # ================================================================
  # Structured values — lists, maps, sets, $-operators
  # ================================================================

  - name: assertion_operators
    desc: All 9 assertion operators work correctly
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/operators.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: eq_scalar
                status: pass
                expected:
                  - product_name: { $eq: "Milk" }
                traces:
                  - Run: { operation: get_product }
                  - Event: { name: product_name, value: "Milk" }
                  - Event: { name: price, value: 4 }
                  - Event: { name: tags, value: [ "dairy", "organic", "local" ] }
                  - Event: { name: attributes, value: { category: "food", origin: "local" } }
                  - Event: { name: $result, value: { attributes: { category: "food", origin: "local" }, price: 4, product_name: "Milk", tags: [ "dairy", "organic", "local" ] } }
              - name: size_list
                status: pass
                expected:
                  - tags: { $size: 3 }
                traces:
                  - Run: { operation: get_product }
                  - Event: { name: product_name, value: "Milk" }
                  - Event: { name: price, value: 4 }
                  - Event: { name: tags, value: [ "dairy", "organic", "local" ] }
                  - Event: { name: attributes, value: { category: "food", origin: "local" } }
                  - Event: { name: $result, value: { attributes: { category: "food", origin: "local" }, price: 4, product_name: "Milk", tags: [ "dairy", "organic", "local" ] } }
              - name: size_map
                status: pass
                expected:
                  - attributes: { $size: 2 }
                traces:
                  - Run: { operation: get_product }
                  - Event: { name: product_name, value: "Milk" }
                  - Event: { name: price, value: 4 }
                  - Event: { name: tags, value: [ "dairy", "organic", "local" ] }
                  - Event: { name: attributes, value: { category: "food", origin: "local" } }
                  - Event: { name: $result, value: { attributes: { category: "food", origin: "local" }, price: 4, product_name: "Milk", tags: [ "dairy", "organic", "local" ] } }
              - name: contains_single
                status: pass
                expected:
                  - tags: { $contains: "dairy" }
                traces:
                  - Run: { operation: get_product }
                  - Event: { name: product_name, value: "Milk" }
                  - Event: { name: price, value: 4 }
                  - Event: { name: tags, value: [ "dairy", "organic", "local" ] }
                  - Event: { name: attributes, value: { category: "food", origin: "local" } }
                  - Event: { name: $result, value: { attributes: { category: "food", origin: "local" }, price: 4, product_name: "Milk", tags: [ "dairy", "organic", "local" ] } }
              - name: contains_all
                status: pass
                expected:
                  - tags: { $containsAll: ["dairy", "organic"] }
                traces:
                  - Run: { operation: get_product }
                  - Event: { name: product_name, value: "Milk" }
                  - Event: { name: price, value: 4 }
                  - Event: { name: tags, value: [ "dairy", "organic", "local" ] }
                  - Event: { name: attributes, value: { category: "food", origin: "local" } }
                  - Event: { name: $result, value: { attributes: { category: "food", origin: "local" }, price: 4, product_name: "Milk", tags: [ "dairy", "organic", "local" ] } }
              - name: excludes_values
                status: pass
                expected:
                  - tags: { $excludes: ["expired", "recalled"] }
                traces:
                  - Run: { operation: get_product }
                  - Event: { name: product_name, value: "Milk" }
                  - Event: { name: price, value: 4 }
                  - Event: { name: tags, value: [ "dairy", "organic", "local" ] }
                  - Event: { name: attributes, value: { category: "food", origin: "local" } }
                  - Event: { name: $result, value: { attributes: { category: "food", origin: "local" }, price: 4, product_name: "Milk", tags: [ "dairy", "organic", "local" ] } }
              - name: excludes_fails_when_present
                status: fail
                expected:
                  - tags: { $excludes: ["dairy"] }
                traces:
                  - Run: { operation: get_product }
                  - Event: { name: product_name, value: "Milk" }
                  - Event: { name: price, value: 4 }
                  - Event: { name: tags, value: [ "dairy", "organic", "local" ] }
                  - Event: { name: attributes, value: { category: "food", origin: "local" } }
                  - Event: { name: $result, value: { attributes: { category: "food", origin: "local" }, price: 4, product_name: "Milk", tags: [ "dairy", "organic", "local" ] } }
              - name: match_partial_object
                status: pass
                expected:
                  - attributes: { $match: { "category": "food" } }
                traces:
                  - Run: { operation: get_product }
                  - Event: { name: product_name, value: "Milk" }
                  - Event: { name: price, value: 4 }
                  - Event: { name: tags, value: [ "dairy", "organic", "local" ] }
                  - Event: { name: attributes, value: { category: "food", origin: "local" } }
                  - Event: { name: $result, value: { attributes: { category: "food", origin: "local" }, price: 4, product_name: "Milk", tags: [ "dairy", "organic", "local" ] } }
              - name: exists_field
                status: pass
                expected:
                  - product_name: { $exists: true }
                traces:
                  - Run: { operation: get_product }
                  - Event: { name: product_name, value: "Milk" }
                  - Event: { name: price, value: 4 }
                  - Event: { name: tags, value: [ "dairy", "organic", "local" ] }
                  - Event: { name: attributes, value: { category: "food", origin: "local" } }
                  - Event: { name: $result, value: { attributes: { category: "food", origin: "local" }, price: 4, product_name: "Milk", tags: [ "dairy", "organic", "local" ] } }
              - name: any_with_matcher
                status: pass
                expected:
                  - tags: { $any: { $matches: "^org" } }
                traces:
                  - Run: { operation: get_product }
                  - Event: { name: product_name, value: "Milk" }
                  - Event: { name: price, value: 4 }
                  - Event: { name: tags, value: [ "dairy", "organic", "local" ] }
                  - Event: { name: attributes, value: { category: "food", origin: "local" } }
                  - Event: { name: $result, value: { attributes: { category: "food", origin: "local" }, price: 4, product_name: "Milk", tags: [ "dairy", "organic", "local" ] } }
              - name: type_check
                status: pass
                expected:
                  - product_name: { $type: "string" }
                traces:
                  - Run: { operation: get_product }
                  - Event: { name: product_name, value: "Milk" }
                  - Event: { name: price, value: 4 }
                  - Event: { name: tags, value: [ "dairy", "organic", "local" ] }
                  - Event: { name: attributes, value: { category: "food", origin: "local" } }
                  - Event: { name: $result, value: { attributes: { category: "food", origin: "local" }, price: 4, product_name: "Milk", tags: [ "dairy", "organic", "local" ] } }
              - name: composed_operators
                status: pass
                expected:
                  - tags: { $size: 3, $containsAll: ["dairy", "organic", "local"] }
                traces:
                  - Run: { operation: get_product }
                  - Event: { name: product_name, value: "Milk" }
                  - Event: { name: price, value: 4 }
                  - Event: { name: tags, value: [ "dairy", "organic", "local" ] }
                  - Event: { name: attributes, value: { category: "food", origin: "local" } }
                  - Event: { name: $result, value: { attributes: { category: "food", origin: "local" }, price: 4, product_name: "Milk", tags: [ "dairy", "organic", "local" ] } }

  - name: structured_list_matching
    desc: List outputs match with exact, $contains, $size, $any operators
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/structured_output.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: list_exact_match
                status: pass
                expected:
                  - entity_name: "Customer"
                  - key_properties: ["ID"]
                  - structural_properties: ["ID", "Name", "Email"]
                traces:
                  - Run: { operation: resolve_entity }
                  - Event: { name: entity_name, value: "Customer" }
                  - Event: { name: key_properties, value: [ "ID" ] }
                  - Event: { name: structural_properties, value: [ "ID", "Name", "Email" ] }
                  - Event: { name: $result, value: { entity_name: "Customer", key_properties: [ "ID" ], structural_properties: [ "ID", "Name", "Email" ] } }
              - name: list_contains_check
                status: pass
                expected:
                  - structural_properties: { $contains: "Name" }
                traces:
                  - Run: { operation: resolve_entity }
                  - Event: { name: entity_name, value: "Customer" }
                  - Event: { name: key_properties, value: [ "ID" ] }
                  - Event: { name: structural_properties, value: [ "ID", "Name", "Email" ] }
                  - Event: { name: $result, value: { entity_name: "Customer", key_properties: [ "ID" ], structural_properties: [ "ID", "Name", "Email" ] } }
              - name: list_size_check
                status: pass
                expected:
                  - structural_properties: { $size: 3 }
                traces:
                  - Run: { operation: resolve_entity }
                  - Event: { name: entity_name, value: "Customer" }
                  - Event: { name: key_properties, value: [ "ID" ] }
                  - Event: { name: structural_properties, value: [ "ID", "Name", "Email" ] }
                  - Event: { name: $result, value: { entity_name: "Customer", key_properties: [ "ID" ], structural_properties: [ "ID", "Name", "Email" ] } }
              - name: list_any_operator
                status: pass
                expected:
                  - key_properties: { $any: "ID" }
                traces:
                  - Run: { operation: resolve_entity }
                  - Event: { name: entity_name, value: "Customer" }
                  - Event: { name: key_properties, value: [ "ID" ] }
                  - Event: { name: structural_properties, value: [ "ID", "Name", "Email" ] }
                  - Event: { name: $result, value: { entity_name: "Customer", key_properties: [ "ID" ], structural_properties: [ "ID", "Name", "Email" ] } }
              - name: list_wrong_value_fails
                status: fail
                expected:
                  - key_properties: ["NonexistentKey"]
                traces:
                  - Run: { operation: resolve_entity }
                  - Event: { name: entity_name, value: "Customer" }
                  - Event: { name: key_properties, value: [ "ID" ] }
                  - Event: { name: structural_properties, value: [ "ID", "Name", "Email" ] }
                  - Event: { name: $result, value: { entity_name: "Customer", key_properties: [ "ID" ], structural_properties: [ "ID", "Name", "Email" ] } }

  - name: structured_map_matching
    desc: Map outputs match with key-value, subset, $size operators
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/structured_map.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: map_key_value_match
                status: pass
                expected:
                  - $result: {"ID": "1", "Name": "Customer"}
                traces:
                  - Run: { operation: get_entity_values }
                  - Event: { name: get_entity_values.id, value: 1 }
                  - Event: { name: $result, value: {"ID": "1", "Name": "Customer", "Email": "cust@example.com"} }
              - name: map_subset_match
                status: pass
                expected:
                  - $result: {"ID": "1"}
                traces:
                  - Run: { operation: get_entity_values }
                  - Event: { name: get_entity_values.id, value: 1 }
                  - Event: { name: $result, value: {"ID": "1", "Name": "Customer", "Email": "cust@example.com"} }
              - name: map_wrong_value_fails
                status: fail
                expected:
                  - $result: {"ID": "999"}
                traces:
                  - Run: { operation: get_entity_values }
                  - Event: { name: get_entity_values.id, value: 1 }
                  - Event: { name: $result, value: {"ID": "1", "Name": "Customer", "Email": "cust@example.com"} }
              - name: map_size_check
                status: pass
                expected:
                  - $result: { $size: 3 }
                traces:
                  - Run: { operation: get_entity_values }
                  - Event: { name: get_entity_values.id, value: 1 }
                  - Event: { name: $result, value: {"ID": "1", "Name": "Customer", "Email": "cust@example.com"} }

  - name: structured_set_matching
    desc: Set outputs match with $set presence, $contains, $size operators
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/structured_set.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: set_presence_match
                status: pass
                expected:
                  - $result: { $containsAll: [ "Orders", "Address" ] }
                traces:
                  - Run: { operation: get_navigation_properties }
                  - Event: { name: $result, value: ["Address", "Contacts", "Orders"] }
              - name: set_all_items
                status: pass
                expected:
                  - $result: { $containsAll: [ "Orders", "Address", "Contacts" ] }
                traces:
                  - Run: { operation: get_navigation_properties }
                  - Event: { name: $result, value: ["Address", "Contacts", "Orders"] }
              - name: set_missing_item_fails
                status: fail
                target_failures: []
                expected:
                  - $result: { $containsAll: [ "Orders", "NonexistentNav" ] }
                traces:
                  - Run: { operation: get_navigation_properties }
                  - Event: { name: $result, value: ["Address", "Contacts", "Orders"] }
              - name: set_size_check
                status: pass
                expected:
                  - $result: { $size: 3 }
                traces:
                  - Run: { operation: get_navigation_properties }
                  - Event: { name: $result, value: ["Address", "Contacts", "Orders"] }
              - name: set_contains_check
                status: pass
                expected:
                  - $result: { $contains: "Contacts" }
                traces:
                  - Run: { operation: get_navigation_properties }
                  - Event: { name: $result, value: ["Address", "Contacts", "Orders"] }

  - name: multi_target_divergence
    desc: A non-asserted field differing across targets is reported as a TargetFailure
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/divergence_witness.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: targets_diverge_on_engine
                status: fail
                target_failures:
                  - target: csharp

  - name: nested_structured_matching
    desc: List of maps — nested operators ($any with $match, $contains with $match)
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/nested_structured.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: nested_list_of_maps_exact
                status: pass
              - name: nested_any_with_match
                status: pass
              - name: nested_size
                status: pass
              - name: nested_contains_element
                status: pass

  - name: scalar_operators_matching
    desc: Regex, negation, numeric comparisons, empty, $every, multi-field
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/scalar_operators.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: regex_match
                status: pass
                expected:
                  - label: { $matches: "^sensor-[A-Z]\\d+-\\w+$" }
                traces:
                  - Run: { operation: get_measurement }
                  - Event: { name: temperature, value: 72 }
                  - Event: { name: label, value: "sensor-A3-north" }
                  - Event: { name: readings, value: [ 68, 70, 72, 71, 73 ] }
                  - Event: { name: $result, value: { label: "sensor-A3-north", readings: [ 68, 70, 72, 71, 73 ], temperature: 72 } }
              - name: regex_no_match_fails
                status: fail
                expected:
                  - label: { $matches: "^invalid" }
                traces:
                  - Run: { operation: get_measurement }
                  - Event: { name: temperature, value: 72 }
                  - Event: { name: label, value: "sensor-A3-north" }
                  - Event: { name: readings, value: [ 68, 70, 72, 71, 73 ] }
                  - Event: { name: $result, value: { label: "sensor-A3-north", readings: [ 68, 70, 72, 71, 73 ], temperature: 72 } }
              - name: ne_value
                status: pass
                expected:
                  - temperature: { $ne: 100 }
                traces:
                  - Run: { operation: get_measurement }
                  - Event: { name: temperature, value: 72 }
                  - Event: { name: label, value: "sensor-A3-north" }
                  - Event: { name: readings, value: [ 68, 70, 72, 71, 73 ] }
                  - Event: { name: $result, value: { label: "sensor-A3-north", readings: [ 68, 70, 72, 71, 73 ], temperature: 72 } }
              - name: ne_fails_when_equal
                status: fail
                expected:
                  - temperature: { $ne: 72 }
                traces:
                  - Run: { operation: get_measurement }
                  - Event: { name: temperature, value: 72 }
                  - Event: { name: label, value: "sensor-A3-north" }
                  - Event: { name: readings, value: [ 68, 70, 72, 71, 73 ] }
                  - Event: { name: $result, value: { label: "sensor-A3-north", readings: [ 68, 70, 72, 71, 73 ], temperature: 72 } }
              - name: not_gt
                status: pass
                expected:
                  - temperature: { $not: { $gt: 100 } }
                traces:
                  - Run: { operation: get_measurement }
                  - Event: { name: temperature, value: 72 }
                  - Event: { name: label, value: "sensor-A3-north" }
                  - Event: { name: readings, value: [ 68, 70, 72, 71, 73 ] }
                  - Event: { name: $result, value: { label: "sensor-A3-north", readings: [ 68, 70, 72, 71, 73 ], temperature: 72 } }
              - name: not_gt_fails
                status: fail
                expected:
                  - temperature: { $not: { $gt: 70 } }
                traces:
                  - Run: { operation: get_measurement }
                  - Event: { name: temperature, value: 72 }
                  - Event: { name: label, value: "sensor-A3-north" }
                  - Event: { name: readings, value: [ 68, 70, 72, 71, 73 ] }
                  - Event: { name: $result, value: { label: "sensor-A3-north", readings: [ 68, 70, 72, 71, 73 ], temperature: 72 } }
              - name: not_lt
                status: pass
                expected:
                  - temperature: { $not: { $lt: 50 } }
                traces:
                  - Run: { operation: get_measurement }
                  - Event: { name: temperature, value: 72 }
                  - Event: { name: label, value: "sensor-A3-north" }
                  - Event: { name: readings, value: [ 68, 70, 72, 71, 73 ] }
                  - Event: { name: $result, value: { label: "sensor-A3-north", readings: [ 68, 70, 72, 71, 73 ], temperature: 72 } }
              - name: not_matches
                status: pass
                expected:
                  - label: { $not: { $matches: "^device-" } }
                traces:
                  - Run: { operation: get_measurement }
                  - Event: { name: temperature, value: 72 }
                  - Event: { name: label, value: "sensor-A3-north" }
                  - Event: { name: readings, value: [ 68, 70, 72, 71, 73 ] }
                  - Event: { name: $result, value: { label: "sensor-A3-north", readings: [ 68, 70, 72, 71, 73 ], temperature: 72 } }
              - name: not_size
                status: pass
                expected:
                  - readings: { $not: { $size: 3 } }
                traces:
                  - Run: { operation: get_measurement }
                  - Event: { name: temperature, value: 72 }
                  - Event: { name: label, value: "sensor-A3-north" }
                  - Event: { name: readings, value: [ 68, 70, 72, 71, 73 ] }
                  - Event: { name: $result, value: { label: "sensor-A3-north", readings: [ 68, 70, 72, 71, 73 ], temperature: 72 } }
              - name: not_contains
                status: pass
                expected:
                  - readings: { $not: { $contains: 999 } }
                traces:
                  - Run: { operation: get_measurement }
                  - Event: { name: temperature, value: 72 }
                  - Event: { name: label, value: "sensor-A3-north" }
                  - Event: { name: readings, value: [ 68, 70, 72, 71, 73 ] }
                  - Event: { name: $result, value: { label: "sensor-A3-north", readings: [ 68, 70, 72, 71, 73 ], temperature: 72 } }
              - name: not_every
                status: pass
                expected:
                  - readings: { $not: { $every: { $gt: 71 } } }
                traces:
                  - Run: { operation: get_measurement }
                  - Event: { name: temperature, value: 72 }
                  - Event: { name: label, value: "sensor-A3-north" }
                  - Event: { name: readings, value: [ 68, 70, 72, 71, 73 ] }
                  - Event: { name: $result, value: { label: "sensor-A3-north", readings: [ 68, 70, 72, 71, 73 ], temperature: 72 } }
              - name: gt_passes
                status: pass
                expected:
                  - temperature: { $gt: 70 }
                traces:
                  - Run: { operation: get_measurement }
                  - Event: { name: temperature, value: 72 }
