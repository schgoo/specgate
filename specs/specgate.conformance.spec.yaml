# yaml-language-server: $schema=../spec-schema.json
# SpecGate component: specgate.conformance
#
# Cross-language conformance ledger. Each case runs a dual-bound fixture
# through the harness and asserts every bound target emits a byte-identical
# canonical trace. Split out of the engine spec (specgate.harness) so
# operation-shape coverage across targets is tracked independently of
# harness-mechanism behavior.
#
# Trace matching rules:
#   - Ordered assertions matched as subsequence (gaps allowed)
#   - "$run: operation" matches a Run event
#   - "name: value" matches an Event with that name and value
#   - "$unordered: [...]" — all items must appear, any order, between surrounding ordered items
#   - "$anywhere: [...]" — items must appear somewhere in the trace, position irrelevant

spec_version: "0.4.0"
name: specgate.conformance
binding: bindings/rust.yaml
target: run_spec

types:
  # `value` is a built-in spec type: the universal structured trace value —
  # any scalar, or a list/map/set of `value`. The matcher compares scalars
  # type-exactly except int/float numeric equivalence; lists use subsequence
  # (or $unordered), maps check key+value, sets check presence. A null/None
  # field is represented by the absence of its event. (Previously
  # hand-modelled here as a `Value` oneof;
  # it is now a built-in because the runtime `Value` is the spec's own value
  # lattice and cannot itself be a SpecEvent.)

  TraceEvent:
    oneof:
      Event: { span: string, name: string, value: value }
      Run: { span: string, operation: string }

  Assertion:
    desc: >
      Expected assertions support exact values, structured values
      (lists, maps), and $-operators for flexible matching.
    oneof:
      Event: { name: string, value: value }
      $run: { operation: string }
      $unordered: { items: List<Assertion> }
      $anywhere: { items: List<Assertion> }

  Source:
    assertion_ids: List<string>
    spec: string
    section: string

  CaseResult:
    name: string
    status:
      oneof: [pass, fail, skip, warn]
    kind:
      oneof: [standard, property]
      default: standard
    level:
      oneof: [must, should, may]
    source: Source  # optional
    # Standard case fields
    expected: List<Assertion>
    traces: List<TraceEvent>  # the canonical trace every bound target must produce; on pass, what all targets emitted
    # Multi-target conformance (only when a spec has multiple bindings)
    target_failures: List<TargetFailure>  # optional — present only for targets whose traces diverge from `traces`
    # Property case fields (only when kind: property)
    counterexample: Map<string, value>  # generator values that caused failure (only on fail)
    # traces: included on property fail — the trace from the counterexample run

  TargetFailure:
    target: string  # the binding target (e.g. csharp) whose traces diverged
    traces: List<TraceEvent>  # what this target actually produced
    mismatch: string  # human-readable description of the first divergence

  # --- Structural conformance: self-described schema (discovery) ------------
  # A component's schema, normalized to spec types and folded to the black-box
  # spec view. Every bound target must self-describe to the SAME normalized
  # schema — structural conformance, complementing the trace (behavioral)
  # conformance above. Per-language discovery metadata (Rust discovery_json, C#
  # reflection) carries implementation detail — is_setup, fills, module paths,
  # per-language type spelling — which discover consumes to FOLD setups into
  # their operation's inputs (the invisible-setup model) and normalize types,
  # exposing only the language-neutral operations and types below. Setups,
  # is_setup, and fills never surface here: whether a target uses a setup or a
  # plain parameter is an implementation choice, and both must fold to the same
  # operation inputs.

  DiscoveredInput:
    name: string
    type: string  # normalized spec type, e.g. "i32", "List<i32>", "Option<i32>"

  DiscoveredOperation:
    name: string
    async: bool  # true only for async operations (mirrors the spec's `async:` flag)
    inputs: List<DiscoveredInput>  # black-box inputs, with any setup construction params folded in
    output: string  # normalized spec return type; empty when the operation returns nothing

  DiscoveredField:
    name: string
    type: string  # normalized spec type

  DiscoveredVariant:
    name: string
    fields: List<DiscoveredField>  # empty for unit/tuple variants

  DiscoveredType:
    name: string
    kind:
      oneof: [struct, enum]
    fields: List<DiscoveredField>  # struct fields (empty for enums)
    variants: List<DiscoveredVariant>  # enum variants (empty for structs)

  DiscoveredSchema:
    component: string
    operations: List<DiscoveredOperation>
    types: List<DiscoveredType>

  # One entry per BOUND target (every binding file × target). Makes per-target
  # participation first-class: a target that is skipped or never consulted is
  # visibly ABSENT from the list, so "all targets agree" is provable rather than
  # assumed. A self-describing target echoes its own full normalized schema
  # (identical to the canonical `schema` when it conforms; different when it
  # diverges — the difference is visible by comparison, so no separate
  # divergence type is needed). A target that emits no discovery metadata is
  # NotSelfDescribing — the structural analog of a behavioral TargetFailure.
  TargetDiscovery:
    target: string  # binding target label, e.g. "binding.yaml::default", "csharp.yaml::default"
    outcome:
      oneof:
        SelfDescribed:
          schema: DiscoveredSchema  # this target's full normalized schema (echoed, not summarized)
        NotSelfDescribing:
          reason: string  # why no schema was produced, e.g. "no discovery metadata emitted"

operations:
  run_spec:
    desc: Run all test cases in a spec file and return results with traces.
    inputs:
      spec:
        type: string
        desc: Path to the spec YAML file (relative to repo root)
    outputs:
      - outcome:
          oneof:
            Complete:
              results: List<CaseResult>
            Error:
              reason: string

  discover:
    desc: >
      Report a component's self-described schema, normalized to spec types.
      Like run_spec, discover reads the spec's component and EVERY bound target,
      asks each to self-describe, and normalizes each to spec types — structural
      conformance, complementing run_spec's behavioral (trace) conformance. The
      canonical `schema` is what the self-describing targets agree on. `targets`
      enumerates every bound target and its outcome: a self-describing target
      echoes its own full normalized schema (which must equal the canonical
      schema to conform); a target that emits no discovery metadata is
      NotSelfDescribing. Because every bound target appears in `targets`, a
      skipped or non-participating target is visible rather than silently
      absent — the structural analog of run_spec listing a target_failure.
    inputs:
      spec:
        type: string
        desc: Path to the spec YAML whose component and targets to discover
    outputs:
      - outcome:
          oneof:
            Complete:
              schema: DiscoveredSchema  # canonical schema the self-describing targets agree on
              targets: List<TargetDiscovery>  # one entry per bound target (binding x target)
            Error:
              reason: string

cases:

  # ================================================================
  # Structural conformance — self-described schema (discovery)
  # ================================================================
  # discover(spec) consults EVERY bound target of a fixture, normalizes each
  # self-report to spec types, and returns the canonical `schema` plus a
  # per-target `targets` list — the structural half of conformance (run_spec
  # below is the behavioral half). Every bound target appears in `targets`, so a
  # skipped or non-participating target is VISIBLE, not silently assumed to
  # agree. The Rust target self-describes (SelfDescribed, echoing its full
  # normalized schema, which must equal the canonical schema); the C# targets do
  # not self-describe yet (NotSelfDescribing). When C# discovery lands, each
  # csharp entry flips to SelfDescribed echoing the same schema — forcing the C#
  # reflection to produce a matching normalized schema, canonical unchanged.
  #
  # These cases exercise every value the schema can carry: both `async` values,
  # empty vs non-empty `output`, every normalized type category (primitive
  # scalars, List / Option / Result / map / set collections, and named
  # struct / enum complex types), and both empty (unit) and populated enum
  # variants.
  #
  # NOTE: example schema values are best-effort — reconcile exact type spellings
  # and list order against real discover output during implementation.

  # --- Primitive scalars, async flag, empty output ---

  - name: discover_scalar_operation
    desc: A synchronous scalar operation self-describes async:false with typed i32 inputs and output.
    operation: discover
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/stateless_add.spec.yaml
    expected:
      - $result:
          Complete:
            schema: &schema_stateless_add
              component: fixture.stateless_add
              operations:
                - name: add
                  async: false
                  inputs:
                    - { name: a, type: i32 }
                    - { name: b, type: i32 }
                  output: i32
              types: []
            targets:
              - target: "binding::default"
                outcome: { SelfDescribed: { schema: *schema_stateless_add } }
              - target: "csharp::default"
                outcome: { SelfDescribed: { schema: *schema_stateless_add } }
              - target: "csharp-net8::default"
                outcome: { SelfDescribed: { schema: *schema_stateless_add } }

  - name: discover_async_operation
    desc: An async operation self-describes async:true with its string input and output.
    operation: discover
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/async_fetch.spec.yaml
    expected:
      - $result:
          Complete:
            schema: &schema_async_fetch
              component: fixture.async_fetch
              operations:
                - name: fetch
                  async: true
                  inputs:
                    - { name: url, type: string }
                  output: string
              types: []
            targets:
              - target: "binding::default"
                outcome: { SelfDescribed: { schema: *schema_async_fetch } }
              - target: "csharp::default"
                outcome: { SelfDescribed: { schema: *schema_async_fetch } }

  - name: discover_void_operation
    desc: >
      An operation returning nothing self-describes an empty output; its
      receiver setup folds away, leaving only the black-box input.
    operation: discover
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/void_operation.spec.yaml
    expected:
      - $result:
          Complete:
            schema: &schema_void_operation
              component: fixture.void_operation
              operations:
                - name: log
                  inputs:
                    - { name: msg, type: string }
                  output: ""
              types: []
            targets:
              - target: "binding::default"
                outcome: { SelfDescribed: { schema: *schema_void_operation } }
              - target: "csharp::default"
                outcome: { SelfDescribed: { schema: *schema_void_operation } }

  - name: discover_scalar_builtin_types
    desc: >
      An operation over an i64 and a bool returning the universal `value` type
      self-describes the remaining scalar built-ins (i64, bool, value).
    operation: discover
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/scalar_types.spec.yaml
    expected:
      - $result:
          Complete:
            schema: &schema_scalar_types
              component: fixture.scalar_types
              operations:
                - name: classify
                  inputs:
                    - { name: id, type: i64 }
                    - { name: active, type: bool }
                  output: value
              types: []
            targets:
              - target: "binding::default"
                outcome: { SelfDescribed: { schema: *schema_scalar_types } }
              - target: "csharp::default"
                outcome: { SelfDescribed: { schema: *schema_scalar_types } }

  - name: discover_option_and_list_types
    desc: >
      An operation over a list input returning an Option self-describes the
      normalized container types, matching the fixture's declared spec types.
    operation: discover
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/option_some.spec.yaml
    expected:
      - $result:
          Complete:
            schema: &schema_option_some
              component: fixture.option_some
              operations:
                - name: find
                  inputs:
                    - { name: items, type: "List<i32>" }
                    - { name: target, type: i32 }
                  output: "Option<i32>"
              types: []
            targets:
              - target: "binding::default"
                outcome: { SelfDescribed: { schema: *schema_option_some } }
              - target: "csharp::default"
                outcome: { SelfDescribed: { schema: *schema_option_some } }

  # --- Collection types: map, set, Result ---

  - name: discover_map_output
    desc: An operation returning a map self-describes the normalized map type.
    operation: discover
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/structured_map.spec.yaml
    expected:
      - $result:
          Complete:
            schema: &schema_structured_map
              component: fixture.structured_map
              operations:
                - name: get_entity_values
                  inputs:
                    - { name: id, type: i32 }
                  output: "map<string, string>"
              types: []
            targets:
              - target: "binding::default"
                outcome: { SelfDescribed: { schema: *schema_structured_map } }
              - target: "csharp::default"
                outcome: { SelfDescribed: { schema: *schema_structured_map } }

  - name: discover_set_output
    desc: An operation returning a set self-describes the normalized set type.
    operation: discover
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/structured_set.spec.yaml
    expected:
      - $result:
          Complete:
            schema: &schema_structured_set
              component: fixture.structured_set
              operations:
                - name: get_navigation_properties
                  inputs: []
                  output: "set<string>"
              types: []
            targets:
              - target: "binding::default"
                outcome: { SelfDescribed: { schema: *schema_structured_set } }
              - target: "csharp::default"
                outcome: { SelfDescribed: { schema: *schema_structured_set } }

  - name: discover_result_output
    desc: An operation returning a Result self-describes the normalized Result type.
    operation: discover
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/result_ok.spec.yaml
    expected:
      - $result:
          Complete:
            schema: &schema_result_ok
              component: fixture.result_ok
              operations:
                - name: try_divide
                  inputs:
                    - { name: a, type: i32 }
                    - { name: b, type: i32 }
                  output: "Result<i32, string>"
              types: []
            targets:
              - target: "binding::default"
                outcome: { SelfDescribed: { schema: *schema_result_ok } }
              - target: "csharp::default"
                outcome: { SelfDescribed: { schema: *schema_result_ok } }

  # --- Complex types: named struct and named enum (in `types`) ---

  - name: discover_struct_type
    desc: >
      A struct return type self-describes as a kind:struct entry in `types`,
      with its fields normalized (honoring spec_event renames).
    operation: discover
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/structured_output.spec.yaml
    expected:
      - $result:
          Complete:
            schema: &schema_structured_output
              component: fixture.structured_output
              operations:
                - name: resolve_entity
                  inputs: []
                  output: EntityType
              types:
                - name: EntityType
                  kind: struct
                  fields:
                    - { name: entity_name, type: string }
                    - { name: key_properties, type: "List<string>" }
                    - { name: structural_properties, type: "List<string>" }
                  variants: []
            targets:
              - target: "binding::default"
                outcome: { SelfDescribed: { schema: *schema_structured_output } }
              - target: "csharp::default"
                outcome: { SelfDescribed: { schema: *schema_structured_output } }

  - name: discover_enum_type
    desc: >
      An enum return type self-describes as a kind:enum entry in `types`, with
      both a unit variant (empty fields) and struct variants (populated fields).
    operation: discover
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/enum_event.spec.yaml
    expected:
      - $result:
          Complete:
            schema: &schema_enum_event
              component: fixture.enum_event
              operations:
                - name: classify
                  inputs:
                    - { name: sides, type: i32 }
                  output: Shape
              types:
                - name: Shape
                  kind: enum
                  fields: []
                  variants:
                    - name: Circle
                      fields:
                        - { name: radius, type: f64 }
                    - name: Rectangle
                      fields:
                        - { name: width, type: f64 }
                        - { name: height, type: f64 }
                    - name: Point
                      fields: []
            targets:
              - target: "binding::default"
                outcome: { SelfDescribed: { schema: *schema_enum_event } }
              - target: "csharp::default"
                outcome: { SelfDescribed: { schema: *schema_enum_event } }

  # --- Real-build witness: a build-time-generated operation ---
  # `witness` is emitted by a build-time code generator in each language (a C#
  # Roslyn source generator and a Rust build.rs), so it exists only in the real
  # compiled artifact — never as a source file on disk. discover finds it only
  # by reflecting over / linking the fixture's real built artifact, and run
  # executes it only when the harness runs that artifact rather than a
  # source-reconstructed surrogate. Dual-bound so the real-build guarantee is
  # enforced for every binding, not just one.

  - name: discover_generated_witness
    desc: >
      An operation emitted by a build-time generator is discovered only when
      reflecting over / linking the real built artifact — for every binding.
    operation: discover
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/realbuild_witness.spec.yaml
    expected:
      - $result:
          Complete:
            schema: &schema_realbuild_witness
              component: fixture.realbuild_witness
              operations:
                - name: witness
                  inputs:
                    - { name: seed, type: i32 }
                  output: i32
              types: []
            targets:
              - target: "binding::default"
                outcome: { SelfDescribed: { schema: *schema_realbuild_witness } }
              - target: "csharp::default"
                outcome: { SelfDescribed: { schema: *schema_realbuild_witness } }

  - name: run_generated_witness
    desc: >
      Running a build-time-generated operation proves the harness builds and
      runs the fixture's real built artifact, not a source-reconstructed
      surrogate: the witness op has no source file on disk (emitted into
      obj/generated for C#, OUT_DIR for Rust), so a source-scanning runner
      cannot execute it. Dual-bound — enforced for every binding.
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/realbuild_witness.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: witness_increments_seed
                status: pass
                expected:
                  - $result: 42
                traces:
                  - Run: { operation: witness }
                  - Event: { name: witness.seed, value: 41 }
                  - Event: { name: $result, value: 42 }

  # ================================================================
  # External dependency — operation using a third-party crate
  # ================================================================

  - name: cross_crate_dependency
    desc: >
      Operation uses an external crate (serde_yaml). The harness must
      depend on the fixture crate as a Cargo dependency, not #[path]
      include the source file. This proves the harness handles real
      crate structures with external dependencies.
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/cross_dep.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: extract_yaml_value
                status: pass
                expected:
                  - $result: "Customer"
                traces:
                  - Run: { operation: parse_yaml_key }
                  - Event: { name: parse_yaml_key.input, value: "name: Customer\nid: 42" }
                  - Event: { name: parse_yaml_key.key, value: "name" }
                  - Event: { name: $result, value: "Customer" }

  # ================================================================
  # Structured values — lists, maps, sets, $-operators
  # ================================================================

  # Assertion operators ($size, $contains, $containsAll, $any, $every, $match,
  # $excludes) apply to structured Value types, not strings: the matcher parses
  # the operator syntax and applies it against the actual Value in the trace.
  # String equality is only the default for scalar values without operators —
  # e.g. a string "3" does NOT satisfy $size: 3 (type mismatch). ($gt/$ne on
  # integer Values are covered by scalar_operators_matching below.)
  - name: assertion_operators
    desc: All 9 assertion operators work correctly
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/operators.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: eq_scalar
                status: pass
                expected:
                  - product_name: { $eq: "Milk" }
                traces:
                  - Run: { operation: get_product }
                  - Event: { name: product_name, value: "Milk" }
                  - Event: { name: price, value: 4 }
                  - Event: { name: tags, value: [ "dairy", "organic", "local" ] }
                  - Event: { name: attributes, value: { category: "food", origin: "local" } }
                  - Event: { name: $result, value: { attributes: { category: "food", origin: "local" }, price: 4, product_name: "Milk", tags: [ "dairy", "organic", "local" ] } }
              - name: size_list
                status: pass
                expected:
                  - tags: { $size: 3 }
                traces:
                  - Run: { operation: get_product }
                  - Event: { name: product_name, value: "Milk" }
                  - Event: { name: price, value: 4 }
                  - Event: { name: tags, value: [ "dairy", "organic", "local" ] }
                  - Event: { name: attributes, value: { category: "food", origin: "local" } }
                  - Event: { name: $result, value: { attributes: { category: "food", origin: "local" }, price: 4, product_name: "Milk", tags: [ "dairy", "organic", "local" ] } }
              - name: size_map
                status: pass
                expected:
                  - attributes: { $size: 2 }
                traces:
                  - Run: { operation: get_product }
                  - Event: { name: product_name, value: "Milk" }
                  - Event: { name: price, value: 4 }
                  - Event: { name: tags, value: [ "dairy", "organic", "local" ] }
                  - Event: { name: attributes, value: { category: "food", origin: "local" } }
                  - Event: { name: $result, value: { attributes: { category: "food", origin: "local" }, price: 4, product_name: "Milk", tags: [ "dairy", "organic", "local" ] } }
              - name: contains_single
                status: pass
                expected:
                  - tags: { $contains: "dairy" }
                traces:
                  - Run: { operation: get_product }
                  - Event: { name: product_name, value: "Milk" }
                  - Event: { name: price, value: 4 }
                  - Event: { name: tags, value: [ "dairy", "organic", "local" ] }
                  - Event: { name: attributes, value: { category: "food", origin: "local" } }
                  - Event: { name: $result, value: { attributes: { category: "food", origin: "local" }, price: 4, product_name: "Milk", tags: [ "dairy", "organic", "local" ] } }
              - name: contains_all
                status: pass
                expected:
                  - tags: { $containsAll: ["dairy", "organic"] }
                traces:
                  - Run: { operation: get_product }
                  - Event: { name: product_name, value: "Milk" }
                  - Event: { name: price, value: 4 }
                  - Event: { name: tags, value: [ "dairy", "organic", "local" ] }
                  - Event: { name: attributes, value: { category: "food", origin: "local" } }
                  - Event: { name: $result, value: { attributes: { category: "food", origin: "local" }, price: 4, product_name: "Milk", tags: [ "dairy", "organic", "local" ] } }
              - name: excludes_values
                status: pass
                expected:
                  - tags: { $excludes: ["expired", "recalled"] }
                traces:
                  - Run: { operation: get_product }
                  - Event: { name: product_name, value: "Milk" }
                  - Event: { name: price, value: 4 }
                  - Event: { name: tags, value: [ "dairy", "organic", "local" ] }
                  - Event: { name: attributes, value: { category: "food", origin: "local" } }
                  - Event: { name: $result, value: { attributes: { category: "food", origin: "local" }, price: 4, product_name: "Milk", tags: [ "dairy", "organic", "local" ] } }
              - name: excludes_fails_when_present
                status: fail
                expected:
                  - tags: { $excludes: ["dairy"] }
                traces:
                  - Run: { operation: get_product }
                  - Event: { name: product_name, value: "Milk" }
                  - Event: { name: price, value: 4 }
                  - Event: { name: tags, value: [ "dairy", "organic", "local" ] }
                  - Event: { name: attributes, value: { category: "food", origin: "local" } }
                  - Event: { name: $result, value: { attributes: { category: "food", origin: "local" }, price: 4, product_name: "Milk", tags: [ "dairy", "organic", "local" ] } }
              - name: match_partial_object
                status: pass
                expected:
                  - attributes: { $match: { "category": "food" } }
                traces:
                  - Run: { operation: get_product }
                  - Event: { name: product_name, value: "Milk" }
                  - Event: { name: price, value: 4 }
                  - Event: { name: tags, value: [ "dairy", "organic", "local" ] }
                  - Event: { name: attributes, value: { category: "food", origin: "local" } }
                  - Event: { name: $result, value: { attributes: { category: "food", origin: "local" }, price: 4, product_name: "Milk", tags: [ "dairy", "organic", "local" ] } }
              - name: exists_field
                status: pass
                expected:
                  - product_name: { $exists: true }
                traces:
                  - Run: { operation: get_product }
                  - Event: { name: product_name, value: "Milk" }
                  - Event: { name: price, value: 4 }
                  - Event: { name: tags, value: [ "dairy", "organic", "local" ] }
                  - Event: { name: attributes, value: { category: "food", origin: "local" } }
                  - Event: { name: $result, value: { attributes: { category: "food", origin: "local" }, price: 4, product_name: "Milk", tags: [ "dairy", "organic", "local" ] } }
              - name: any_with_matcher
                status: pass
                expected:
                  - tags: { $any: { $matches: "^org" } }
