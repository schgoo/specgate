  # ================================================================
  # Happy path — multi-file ops, shared / side-effect setups,
  # language-neutral input names
  # ================================================================

  # Operations a spec references may be defined in different source files; the
  # harness discovers and runs every one regardless of file, and skips no case
  # for a missing-source reason.
  - name: operations_across_files
    desc: Operations defined in separate source files are all discovered and run
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/multi_file.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: greet_from_separate_file
                status: pass
                expected:
                  - $result: "Hello, World!"
              - name: farewell_from_separate_file
                status: pass
                expected:
                  - $result: "Goodbye, World!"

  - name: language_neutral_input_names_run
    desc: Parameters renamed via #[spec_input] are addressed by their spec names
    operation: run_spec
    inputs:
      spec: test/rust/crates/specgate-fixtures/specs/named_inputs.spec.yaml
    expected:
      - $result:
          Complete:
            results:
              - name: divide_10_by_2
                status: pass
                expected:
                  - divide.numerator: 10
                  - divide.denominator: 2
                  - $result: 5
              - name: scale_3_by_4
                status: pass
                expected:
                  - factor: 3
                  - $run: scale
                  - scale.value: 4
